司、中国大唐集团有限公司、中国华电集团有限公司、国家能源投资集团有限责任公司、国家电力投资集团有限公司、中国长江三峡集团有限公司、国家开发投资集团有限公司、中国核工业集团有限公司、中国广核集团有限公司、华润（集团）有限公司、内蒙古电力（集团）有限责任公司，北京、广州电力交易中心，各相关发电企业、电力交易中心： 为贯彻落实党中央、国务院进一步深化电力体制改革，加快建设全国统一大市场的有关精神，建立健全全国统一电力市场“1+N”基础规则体系，进一步规范市场经营主体注册管理水平，我们组织制定了《电力市场注册基本规则》。现印发给你们，请遵照执行。 国家能源局 2024年9月13日 电力市场注册基本规则 第一章 总则 第一条 为贯彻落实党中央、国务院进一步深化电力体制改革、加快建设全国统一大市场的有关精神，统一电力市场注册机制，加强和规范电力市场注册工作，维护电力市场秩序和各类经营主体合法权益，根据《中共中央 国务院关于进一步深化电力体制改革的若干意见》《国家发展改革委 国家能源局关于加快建设全国统一电力市场体系的指导意见》（发改体改〔2022〕118号）《电力市场运行基本规则》（中华人民共和国国家发展和改革委员会2024年第20号令）等文件，结合工作实际，制定本规则。 第二条 本规则所称电力市场包含电力中长期、现货、辅助服务市场等。 第三条 本规则所称的经营主体包括参与电力市场交易的发电企业、售电公司、电力用户和新型经营主体（含新型储能企业、虚拟电厂、智能微电网等）。 第四条 电力市场注册应遵循以下原则： （一）规范入市。拟参与电力市场交易的经营主体应在电力交易机构办理市场注册，对注册业务信息以及相关支撑性材料的真实性、准确性、完整性负责。 （二）公开透明。电力交易机构公平公开受理各类市场注册业务，不得设置不合理和歧视性的条件以限制商品服务、要素资源自由流动，做到服务无差别，信息规范披露，接受公众监督。 （三）全国统一。严格落实“全国一张清单”管理模式，严禁各部门自行发布具有市场准入性质的负面清单，严禁单独设置附加条件。经营主体市场注册业务流程、审验标准、受理期限、公示要求应做到全国统一规范。 （四）信息共享。经营主体可自主选择电力交易机构进行办理，获取交易资格，无需重复注册。电力交易平台应实现互联互通，共享注册信息，实现“一地注册、各方共享”。 第五条 电力交易机构负责开展电力市场注册服务，建设并运维电力交易平台市场注册业务功能，依法依规披露市场注册业务的相关信息。实现与电力调度机构电力调度自动化系统及电网企业营销、新型电力负荷管理系统的市场注册所需信息交互，提升经营主体市场注册业务便捷性。 第六条 本规则适用于全国范围内各类经营主体的电力市场注册，各省、自治区、直辖市统一按照规范执行。 第二章 基本条件 第七条 经营主体应当是财务独立核算、能够独立承担民事责任的企业、经法人单位授权的内部核算主体、个体工商户、执行工商业电价或具有分布式电源的自然人等民事主体，提供有效身份证明证件及相关注册材料，可办理市场注册业务；若存在较严重的不良信用记录或者曾作出虚假承诺等情形的经营主体，在修复后方可办理市场注册业务。 第八条 发电企业基本条件： （一）依法取得发电项目核准或者备案文件，依法取得、按规定时限正在办理或者豁免电力业务许可证（发电类）； （二）已与电网企业签订并网调度协议，接入电力调度自动化系统； （三）具备相应的计量能力或者替代技术手段，满足电力市场计量和结算的要求； （四）并网自备电厂取得电力业务许可证（发电类），达到能效、环保要求，可作为经营主体直接参与电力市场交易。 第九条 售电公司按照《售电公司管理办法》（发改体改规〔2021〕1595号）（以下简称《售电公司管理办法》）规定执行，如有新规的从其规定。 第十条 电力用户基本条件： （一）工商业用户原则上全部直接参与电力市场交易，暂未直接参与市场交易的工商业用户按规定由电网企业代理购电； （二）具备相应的计量能力或者替代技术手段，满足电力市场计量和结算的要求。 第十一条 新型储能企业基本条件： （一）与电网企业签订并网调度协议，接入电力调度自动化系统； （二）具备电力、电量数据分时计量与传输条件，数据准确性与可靠性满足结算要求； （三）满足最大充放电功率、最大调节容量及持续充放电时间等对应的技术条件，具体数值以相关标准或国家、地方有关部门规定为准； （四）配建新型储能与所属经营主体视为一体，具备独立计量、控制等技术条件，接入电力调度自动化系统可被电网监控和调度，具有法人资格时可选择转为独立新型储能项目，作为经营主体直接参与电力市场交易。 第十二条 虚拟电厂（含负荷聚合商）经营主体基本条件： （一）与电网企业签订负荷确认协议或并网调度协议，接入新型电力负荷管理系统或电力调度自动化系统； （二）具备电力、电量数据分时计量与传输条件，数据准确性与可靠性满足结算要求； （三）具备聚合可调节负荷以及分布式电源、新型储能等资源的能力； （四）具备对聚合资源的调节或控制能力，拥有具备信息处理、运行监控、业务管理、计量监管、控制执行等功能的软硬件系统； （五）聚合范围、调节性能等条件应满足相应市场的相关规则规定。 第十三条 分布式电源经营主体基本条件： （一）依法取得发电项目核准或者备案文件； （二）与电网企业签订负荷确认协议或并网调度协议，根据电压等级标准接入新型电力负荷管理系统或电力调度自动化系统； （三）具备相应的计量能力或者替代技术手段，满足电力市场计量和结算的要求。 第十四条 电动汽车充电设施经营主体基本条件： （一）具备相应的计量能力或者替代技术手段，满足电力市场计量和结算的要求； （二）有放电能力的电动汽车充电设施，与电网企业签订负荷确认协议，接入新型电力负荷管理系统。 第十五条 智能微电网经营主体基本条件初期参照电力用户基本条件执行，后期视国家有关规定进行调整。 第十六条 当国家政策调整或者交易规则变化导致经营主体类型或进入电力市场基本条件发生变化时，国家能源局按照全国统一标准进行调整。 第三章 市场注册 第十七条 经营主体参与电力市场交易，应当符合基本条件，在电力交易机构办理市场注册。 第十八条 经营主体市场注册按照申请、承诺、审查、公示、生效的流程办理。经营主体应提交身份认证、联系方式等信息以及相关支撑性材料，签订入市协议等。售电公司市场注册条件和流程按照《售电公司管理办法》规定执行，虚拟电厂（含负荷聚合商）初期参照《售电公司管理办法》执行。 第十九条 电力交易机构收到经营主体提交的市场注册申请和注册材料后，在5个工作日内进行审查，必要时组织对经营主体进行现场核验。对于市场注册材料不符合要求的，应予以一次性告知。 第二十条 市场注册审查通过的发电企业、电力用户、新型储能企业、分布式电源、电动汽车充电设施经营主体原则上无需公示，注册手续直接生效。 第二十一条 电力交易机构将市场注册生效的经营主体纳入经营主体目录，实行动态管理，按照信息披露要求向社会公布，根据国家能源局派出机构和地方政府主管部门要求备案。 第二十二条 具有多重主体身份的经营主体，应当按经营主体类别分别进行注册。 第二十三条 原则上同一经营主体在同一合同周期内仅可与一家售电公司、虚拟电厂（含负荷聚合商）确立服务关系。 第二十四条 当国家政策调整或者交易规则变化导致市场注册信息发生变化时，电力交易机构应按照全国统一的原则组织经营主体重新注册或补充完善注册信息。 第四章 信息变更 第二十五条 经营主体市场注册信息发生变化后，应在5个工作日内向首次注册的电力交易机构提出信息变更申请。 第二十六条 经营主体市场注册信息变更按照申请、承诺、审查、公示、生效的流程办理。经营主体应提交变更信息以及相关支撑性材料，若办理信息变更时其他注册信息或支撑性材料已过有效期，需要同步进行更新。售电公司市场注册信息变更条件和流程按照《售电公司管理办法》规定执行，虚拟电厂（含负荷聚合商）初期参照《售电公司管理办法》执行。 第二十七条 信息变更主要包含以下内容： （一）经营主体身份名称变更、法定代表人（或负责人）更换； （二）公司股东、股权结构的重大变化，因公司股权转让导致公司控股股东或者实际控制人发生变化等； （三）电力业务许可证变更、延续等； （四）发电企业机组转让、机组关停退役、机组调度关系调整、机组自备公用性质转换、机组进入及退出商业运营、机组容量调整、其他影响交易组织的关键技术参数变更等； （五）新型储能企业主体储能项目（单元）转让、储能单元容量调整、其他影响交易组织的关键技术参数变更等； （六）售电公司、虚拟电厂（含负荷聚合商）资产总额发生影响年度代理电量规模或调节能力的变化、企业高级或中级职称的专业人员变更、配电网运营资质变化、业务范围变更等。 第二十八条 电力交易机构收到经营主体提交的变更申请和变更材料后，在5个工作日内进行审查。对于变更材料不符合要求的，应予以一次性告知。 第二十九条 市场注册信息变更审查通过的发电企业、电力用户、新型储能企业、分布式电源、电动汽车充电设施经营主体原则上无需公示，信息变更手续直接生效。 第三十条 经营主体市场注册信息发生变化未按规定时间进行变更，并造成不良影响或经济损失的，由经营主体承担相应责任。 第三十一条 经营主体在市场注册信息变更期间可正常参与市场交易。 第五章 市场注销 第三十二条 经营主体退出电力市场交易，分为申请注销和自动注销。售电公司市场注销条件和流程按照《售电公司管理办法》规定执行，虚拟电厂（含负荷聚合商）初期参照《售电公司管理办法》执行。 第三十三条 经营主体有下列正当理由之一的，可申请注销： （一）经营主体宣告破产，或虽未破产但被地方政府主管部门关停或主动拆除，不再发电或者用电； （二）因国家政策、电力市场规则发生重大调整，导致原有经营主体非自身原因无法继续参加市场的情况； （三）因电网网架调整，导致经营主体的发用电物理属性无法满足所在地区的电力市场进入条件； （四）经营主体所有机组关停退役的； （五）经营主体全部电量不再属于工商业用电性质的。 第三十四条 经营主体申请注销，应当符合正当理由，向首次注册的电力交易机构提出市场注销申请。 第三十五条 经营主体申请注销按照申请、声明、审查、公示、生效的流程办理。经营主体应提交注销申请、合同处理完毕声明以及相关支撑材料。 第三十六条 电力交易机构收到经营主体提交的注销申请和注销材料后，在5个工作日内进行审查。对于注销材料不符合要求的，应予以一次性告知。 第三十七条 电力交易机构每年开展经营主体持续满足注册条件核验，必要时组织对经营主体进行现场核验，发现符合正当理由退出电力市场交易或工商营业执照注销、吊销且未申请市场注销的，予以自动注销处理，并报国家能源局派出机构和地方政府主管部门备案。售电公司持续满足注册条件核验按照《售电公司管理办法》规定执行，虚拟电厂（含负荷聚合商）初期参照《售电公司管理办法》执行。 第三十八条 经营主体自动注销由电力交易机构发起，按照公示、生效的流程办理。售电公司退出电力市场交易条件和流程按照《售电公司管理办法》规定执行，虚拟电厂（含负荷聚合商）初期参照《售电公司管理办法》执行。 第三十九条 对于即将市场注销的经营主体，其所有已签订但未履行的市场交易合同，原则上通过自主协商等方式在下一个合同履行月之前的10个工作日内完成处理。因市场交易合同各方造成的损失由退市的经营主体承担，或自行通过司法程序解决。 第四十条 电力交易机构应通过电力交易平台，将经营主体市场注销信息向社会公示，公示期为10个工作日，公示期满无异议，在电力交易平台中予以注销，保留其历史信息5年。 第四十一条 已市场注销的经营主体再次参与电力市场交易，应在电力交易机构重新办理市场注册。 第六章 异议处理 第四十二条 任何单位或个人对于经营主体电力市场注册存在异议，可通过异议反馈渠道向电力交易机构实名反映，需提供包括但不限于异议内容、有效联系方式等信息。异议反馈应提供相关证明材料，不得捏造事实、虚假举证。 第四十三条 对于公示期间存在异议的经营主体，电力交易机构应根据调查情况分类处理。 （一）如因公示材料疏漏缺失、人员等变更而产生异议，经营主体可以补充材料申请再公示； （二）如因材料造假发生异议，经营主体自接到电力交易机构关于异议的告知之日起，5个工作日内无法做出合理解释，电力交易机构终止其市场注册业务公示，将情况报送首次注册地国家能源局派出机构和地方政府主管部门； （三）如对市场注销存在异议，经营主体可向电力交易机构说明情况，电力交易机构根据调查结果予以驳回或撤销公示。 第四十四条 对于公示生效后仍存在异议的经营主体，电力交易机构应继续开展调查，对于调查后不满足电力市场注册条件的经营主体，按照前款要求处理。 第四十五条 电力交易机构应对实名反映人相关身份信息进行保密，不得对外泄露，并及时回复调查处理情况。 第七章 监督管理 第四十六条 国家能源局派出机构和地方政府主管部门按职责分工，对经营主体、电力交易机构开展的电力市场注册工作进行监督管理。 第四十七条 对未及时按本规则办理业务的经营主体，电力交易机构应采取提醒、公告等措施并报国家能源局派出机构和地方政府主管部门。 第四十八条 对于经营主体存在未按规定办理电力市场注册手续、提供虚假注册资料等严重情形的，国家能源局及其派出机构可依照《电力监管条例》第三十一条、《电力市场监管办法》第三十六条有关规定处理。对于电力交易机构存在未按照规定办理电力市场注册等情形的，国家能源局及其派出机构可依照《电力监管条例》第三十三条、《电力市场监管办法》第三十八条有关规定处理。对售电公司在注册过程中存在其他违规行为的，地方政府主管部门可依照《售电公司管理办法》第二十八、二十九、四十二、四十三条有关规定处理。 第四十九条 经营主体在办理电力市场注册业务过程中存在违法违规和失信行为的，纳入电力交易信用评价，国家能源局派出机构和地方政府主管部门可依法依规采取将其纳入失信管理等措施。 第八章 附则 第五十条 本规则由国家能源局负责解释。 第五十一条 本规则自发布之日起施行，有效期五年。 国家能源局有关负责同志就《电力市场注册基本规则》答记者问 010090050000000000000000011124071212399683", "outgoing_relations": [{"target_id": "AUTO-20260424-10A4BBBC6D", "target 电力辅助服务。其中，基本电力辅助服务是经营主体应当无偿提供的电力辅助服务。有偿电力辅助服务是经营主体在基本电力辅助服务之外提供的其他电力辅助服务。具备条件的辅助服务采用市场竞争方式确定提供者。 第二十条 各地按照国家有关规定确定参与辅助服务市场的准入条件时，应当实行公平准入，不得指定特定主体或对特定主体作出歧视性规定。 第二十一条 国家能源局会同国家发展改革委负责制定电力辅助服务管理办法及基本交易规则，明确电力辅助服务的具体内容、技术标准、提供方式、考核方式。 第二十二条 承诺按照要求提供电力辅助服务的经营主体，在实际运行中，电力调度机构按照有关规定进行考核。 第六章 电能计量与结算 第二十三条 经营主体应当安装符合国家标准的电能计量装置，由电能计量检测机构检定后投入使用。 本规则所称电能计量检测机构，是指经政府计量行政部门认可、电能交易双方确认的电能计量检测机构。 第二十四条 电能计量检测机构对电能计量装置实行定期校核。经营主体可以申请校核电能计量装置，经校核，电能计量装置误差达不到规定精度的，由此发生的费用由该电能计量装置的产权方承担；电能计量装置误差达到规定精度的，由此发生的费用由申请方承担。 第二十五条 参与电能量交易的经营主体，应当明确各自电能计量点。电能计量点位于经营主体与电网企业的产权分界点，产权分界点不能安装电能计量装置的，由双方协商确定电能计量点。法定或者约定的计量点计量的电能作为电费结算的依据。经营主体以计量点为分界承担电能损耗和相关责任，国家另有规定的除外。 第二十六条 电网企业应当建立并维护电能计量数据库，并按照有关规定向经营主体公布相关的电能计量数据。 第二十七条 电力市场结算包括电能量交易结算、电力辅助服务交易结算、容量交易结算等。 第二十八条 电网企业和电力调度机构负责向电力交易机构提供相关数据，电力交易机构负责提供电力市场交易结算依据和服务，电网企业受经营主体委托提供相关结算服务。 第二十九条 电力市场成员应当按照政策要求和电力市场运行规则规定的电费结算方式和期限结算电费。 第七章 系统安全 第三十条 经营主体应当执行有关电网运行管理的规程、规定，服从统一调度，加强设备维护，按照并网协议配备必要的安全设施，提供电力辅助服务，维护电力系统的安全稳定运行。 第三十一条 电力调度机构应当严格执行电力调度规则，合理安排系统运行方式，及时预报或者通报影响电力系统安全运行的信息，防止电网事故，保障电网运行安全。负责电力市场交易的安全校核，并公布校核方法、参数。根据电力供需形势、设备运行状况、安全约束条件和系统运行状况，统筹安排电力设备检修计划。电力并网运行管理规定及实施细则由电力监管机构制定。 第三十二条 电力市场技术支持系统建设应当符合规定的性能指标要求，具备能量管理、交易管理、电能计量、结算系统、合同管理、报价处理、市场分析与预测、交易信息、监管系统等功能。 第三十三条 电力市场运营机构负责管理和维护电力市场技术支持系统，保障电力市场运营所需的交易安全、数据安全和网络安全。电力市场技术支持系统建设应当符合规定的性能指标要求，以电力市场运行规则为基础，统一规划、统一设计、统一管理、同步实施、分别维护，根据电力市场发展的需要及时更新。 第八章 市场风险防控和监管 第三十四条 国家发展改革委、国家能源局会同有关部门依职责开展市场监管，引导市场价格运行在合理区间。电力市场应建立健全电力市场风险防控机制，防范市场风险，保障电力系统安全和市场平稳运行，维护经营主体合法权益和社会公共利益。 第三十五条 电力监管机构根据维护电力市场正常运作和电力系统安全的需要，制定电力市场暂停、中止、恢复等干预规则，规定电力市场干预措施实施条件和相关处理方法。 第三十六条 电力市场运营机构按照“谁运营、谁防范，谁运营、谁监控”的原则，履行市场监控和风险防控责任，对市场依规开展监测，接受电力监管机构监管。市场成员应共同遵守并按规定落实电力市场风险防控职责。 第三十七条 任何单位和个人不得非法干预电力市场正常运行，不得实施地方保护、市场分割、指定交易、区域壁垒等妨碍统一市场和公平竞争的政策。 第九章 信息披露 第三十八条 信息披露应当遵循“安全、及时、真实、准确、完整、易于使用”的原则。信息披露主体应严格按照要求披露信息，并对其披露信息的真实性、准确性、完整性、及时性负责。 第三十九条 经营主体、电网企业应当按照有关规定向电力市场运营机构提供信息。电力市场运营机构在确保信息安全基础上，定期向经营主体和社会公众按要求披露电力市场运行信息。 第四十条 电力监管机构制定电力市场信息披露规则并监督实施。 第十章 法律责任 第四十一条 电力市场运营机构违反本规则规定，有下列情形之 一的，按照《电力监管条例》第三十三条的规定处理： （一）不按照本规则及配套规则规定组织交易的； （二）未经电力监管机构审定同意，擅自出台交易细则开展相关电力市场活动的； （三）擅自执行未按法定权限、程序制修订的规则的； （四）其他违反本规则规定且造成社会不良影响的。 第四十二条 任何单位和个人扰乱电力市场运营机构的秩序且影响电力市场活动正常进行，或者危害电力市场及相关技术支持系统安全的，按照有关规定处理；构成犯罪的，依法追究刑事责任。 第十一章 附 则 第四十三条 国家能源局及其派出机构会同有关部门依据本规则组织制定相关配套规则和实施细则。 第四十四条 本规则由国家发展改革委、国家能源局解释。 第四十五条 本规则自2024年7月1日起施行，2005年10月13日发布的《电力市场运营基本规则》（原国家电力监管委员会令第10号）同时废止。 国家规章库 【打印】 【我要纠错】 【关闭窗口】 相关稿件 链接： 全国人大 | 全国政协 | 国家监察委员会 | 最高人民法院 | 最高人民检察院 国务院部门网站 | 地方政府网站 | 驻港澳机构网站 | 驻外机构 中国政府网 | 关于本网 | 网站声明 | 联系我们 | 网站纠错 主办单位：国务院办公厅 运行维护单位：中国政府网运行中心 版权所有：中国政府网 中文域名： 中国政府网.政务 网站标识码bm01000001 京ICP备05070218号 京公网安备11010202000001号 国务院客户端 国务院客户端小程序 中国政府网微博、微信 电脑版 客户端 小程序 微博 微信 邮箱 退出 注册 登录 网站纠错 主办单位：国务院办公厅 运行维护单位：中国政府网运行中心 版权所有：中国政府网 中文域名： 中国政府网.政务 网站标识码bm01000001 京ICP备05070218号 京公网安备11010202000001号 电力市场运行基本规则 (2024年4月18日经国家发展改革委第11次委务会通过 2024年4月25日国家发展改革委令第20号公布 自2024年7月1日起施行)", "outgoing_relations": [], "incoming_relations": [{"target_id": "AUTO-20260425-D49D5FABE6", "target_title": "关于印发《重庆市电力中长期市场实施细则》的通知", "target_date": "2026-04-14", "relation_type": "引用依据", "basis": "规则名称：电力市场运行基本规则", "evidence": "电力用户，相关经营主体： 为贯彻落实加快建设全国统一电力市场要求，进一步深化重庆电力中长期市场建设，规范电力中长期交易行为，适应重庆电力市场高质量发展需要，依据《电力市场运行基本规则》（国家发展和改革委员会令 2024 年第 20 号）、《国家发展改革委 国家能源局关于印发 < 电力中长期市场基本规则 > 的通知》（发改能源规〔 2025 〕", "confidence": "中"}, {"target_id": "AUTO-20260425-A74926FCBF", "target_title": "关于印发《江西省电力中长期市场实施细则》的通知", "target_date": "2026-04-14", "relation_type": "引用依据", "basis": "规则名称：电力市场运行基本规则", "evidence": "电力用户，相关经营主体： 为贯彻落实加快建设全国统一电力市场要求，进一步深化江西电力中长期市场建设，规范电力中长期交易行为，适应江西电力市场高质量发展需要，依据《电力市场运行基本规则》（国家发展和改革委员会令 2024 年第 20 号）、《国家发展改革委 国家能源局关于印发 < 电力中长期市场基本规则 > 的通知》（发改能源规〔 2025 〕", "confidence": "中"}, {"target_id": "AUTO-20260425-712572408D", "target_title": "关于印发《西藏自治区电力中长期市场实施细则》的通知", "target_date": "2026-04-14", "relation_type": "引用依据", "basis": "规则名称：电力市场运行基本规则", "evidence": "电力用户，相关经营主体： 为贯彻落实加快建设全国统一电力市场要求，进一步深化西藏电力中长期市场建设，规范电力中长期交易行为，适应西藏电力市场高质量发展需要，依据《电力市场运行基本规则》（国家发展和改革委员会令 2024 年第 20 号）、《国家发展改革委 国家能源局关于印发 < 电力中长期市场基本规则 > 的通知》（发改能源规〔 2025 〕", "co us": "待人工复核", "snippet": "关于印发《山东电力市场规则(试行)》的通知_国家能源局山东监管办公室 设为首页 工作邮箱 搜索 首页 机构概览 动态要闻 信息公开 在线办事 互动回应 专题专栏 关于印发《山东电力市场规则(试行)》的通知 2025-12-17 18:46 来源：国家能源局山东监管办公室 Aa 字体： 小 | 中 | 大 关于印发《山东电力市场规则(试行)》的通知 鲁监能市场规〔2025〕57号 国网山东省电力公司，华能山东发电公司、华电集团山东分公司、...", "text": "关于印发《山东电力市场规则(试行)》的通知_国家能源局山东监管办公室 设为首页 工作邮箱 搜索 首页 机构概览 动态要闻 信息公开 在线办事 互动回应 专题专栏 关于印发《山东电力市场规则(试行)》的通知 2025-12-17 18:46 来源：国家能源局山东监管办公室 Aa 字体： 小 | 中 | 大 关于印发《山东电力市场规则(试行)》的通知 鲁监能市场规〔2025〕57号 国网山东省电力公司，华能山东发电公司、华电集团山东分公司、国家能源集团山东公司、大唐山东发电公司、国家电投山东分公司、华润电力华北大区、山东核电有限公司，山东电力交易中心，各有关经营主体： 为贯彻落实国家关于深化电力市场化改革工作部署，进一步规范山东电力市场建设和运营，依据全国统一电力市场基础规则，山东能源监管办会同省发展改革委、省能源局，全面总结山东电力市场运行实践经验，组织市场运营机构、电网企业及相关经营主体对山东电力市场规则开展系统性修订，现将修订后《山东电力市场规则(试行)》(以下简称《规则》)印发给你们，并就有关事项通知如下，请遵照执行。 一、《规则》自2026年1月1日起执行。其中，日内市场按需启动的相关条款待技术支持系统功能完善后执行，原则上不晚于2026年7月1日。 二、扶贫发电项目(扶贫容量部分)暂不参与优发超出优购曲线匹配偏差费用分摊，后续根据国家和省有关政策实施。 三、市场运营机构要加强《规则》宣贯培训，规范开展交易组织、交易执行、交易结算、调度运行等工作，认真做好信息披露，强化市场运营监控和风险防控。运行初期要每周组织评估市场运行情况，持续优化业务流程、完善系统功能。市场运营机构会同电网企业，按《规则》要求制定《经营主体节点挂接实施细则》《发电机组调用测试实施细则》等相关执行细则，按规定程序发布、执行。 四、电网企业要做好计量抄表等工作，按时提供计量数据，确保交易结算质量，及时足额进行电费结算。 五、各经营主体、电力用户应系统学习《规则》，做好风险研判，依法依规参与电力市场交易，主动维护良好交易秩序，促进市场健康平稳运行。 新版《规则》正式实施后，原相关市场参数、文件通知等与本《规则》不一致的，按本《规则》执行。执行过程中遇有重大问题及时向山东能源监管办、省发展改革委、省能源局报告并提出工作建议。 联系电话：0531-67800757、67807898 电子邮箱：scjgc@cnea.gov.cn 附件： 《山东电力市场规则（试行）》.pdf 国家能源局山东监管办公室 山东省发展和改革委员会 山东省能源局 2025年12月12日 相关内容： 新版《山东电力市场规则(试行)》政策解读 扫一扫在手机打开当前页 网站地图 联系我们 地址: 济南市市中区七里山路55号 邮编:250002 主办单位: 国家能源局山东监管办公室 京公网安备 11010202007691 网站标识码: bm62000012号 京ICP备11044902号 国家能源局山东监管办公室版权所有，如需转载，请注明来源", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260424-08F5111897", "title": "关于印发《山东省电力并网运行管理实施细则》《山东省电力辅助服务管理实施细则》(修订稿)的通知_国家能源局山东监管办公室", "department": "国家能源局山东监管办公室", "collection_source": "国家能源局山东监管办公室", "publish_date": "2026-01-06", "document_number": "鲁监能市场规〔2025〕63号", "regions": ["山东"], "provinces": ["山东"], "source_type": "监管规则", "policy_level": "国家级", "topics": ["辅助服务", "并网运行"], "keywords": ["辅助服务", "并网运行", "实施细则"], "authority": "A", "time_sens 5项实施细则的通知 信息来源：广州电力交易中心 发布时间：2025-06-22 关于印发《南方区域电力市场中长期电能量交易实施细则》等 5项实施细则的通知 各经营主体，南网超高压公司，各省（区）电网公司、电力调度控制中心、电力交易中心： 为做好南方区域电力市场连续结算试运行工作，进一步规范南方区域电力市场交易，广州电力交易中心与南方总调组织修编了《南方区域电力市场中长期电能量交易实施细则（2025年V1.0版）》（附件1）《南方区域电力市场现货电能量交易实施细则（2025年V1.0版）》（附件2）《南方区域电力市场现货结算实施细则（2025年V1.0版）》（附件3）《南方区域电力市场信息披露实施细则（2025年V1.0版）》（附件4）《南方区域电力市场注册实施细则（2025年V1.0版）》（附件5），经南方区域电力市场管理委员会审议通过，经国家能源局南方监管局复函同意（附件6、附件7），并按照审定意见修改后，现予以印发，请遵照执行。 南方总调、广州电力交易中心将按照南方区域电力市场规则体系规范组织市场成员开展南方区域电力市场连续结算试运行。执行过程中如有问题和意见建议，请及时反馈。《南方区域电力市场中长期电能量交易实施细则2.0版》《南方区域电力市场现货电能量交易实施细则3.0版》《南方区域电力市场现货结算实施细则3.0版》《南方区域电力市场信息披露实施细则》同时废止。 特此通知。 广州电力交易中心有限责任公司 中国南方电力调度控制中心 2025年6月19日 相关附件 关于印发《南方区域电力市场中长期电能量交易实施细则》等5项实施细则的通知.pdf 附件1：南方区域电力市场中长期电能量交易实施细则（2025年V1.0版）.pdf 附件2：南方区域电力市场现货电能量交易实施细则（2025年V1.0版）.pdf 附件3：南方区域电力市场现货结算实施细则（2025年V1.0版）.pdf 附件4：南方区域电力市场信息披露实施细则（2025年V1.0版）.pdf 附件5：南方区域电力市场注册实施细则（2025年V1.0版）.pdf 附件6：关于对南方区域电力市场有关配套实施细则审定意见的函.pdf 附件7：关于同意印发南方区域电力市场注册实施细则的复函.pdf 联系我们 网站地图 相关链接 法律声明 新闻资讯 信息发布 市场服务 政策法规 关于我们 党的声音 公司动态 媒体关注 市场研究 最新通知 公示公告 市场培训 服务承诺 常见问题解答 法律法规 政策文件 交易规则 业务指引 收费标准 公司简介 组织架构 大事记 招聘信息 联系我们 监督举报 信访渠道 广州电力交易 中心公众号 交易服务 留言咨询 400-15-95598 交易服务热线 能源监督热线: 12398 12398能源监管热线网站 12398能源监管 热线公众号 12398能源监管 热线APP 南方电网安备1514A91LF号 ICP国网安备1514A91LF号 版权所有: © 2020 广州电力交易中心 版权所有 粤ICP备20027641号-2", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260425-54244C417B", "title": "【关于印发《电力辅助服务市场基本规则》的通知(发改能源规〔2025〕411号)】-国家发展和改革委员会", "department": "国家发展改革委;国家能源局", "collection_source": "国家发展改革委", "publish_date": "2025-04-29", "document_number": "发改能源规〔2025〕411号", "regions": ["全国"], "provinces": ["全国"], "source_type": "官方政策", "policy_level": "国家级", "topics": ["辅助服务", "电力市场"], "keywords": ["电力辅助服务市场基本规则", "辅助服务", "结算", "市场主体"], "authority": "A", "time_sensitivity": "长期有效型", "status": "现行有效", "is_original": "是", "url": "https://www.ndrc.gov.cn/xxgk/zcfb/ghxwj/202504/t20250429_1397483.html", "local_paths": "01_原始资料\\官方政策\\2025-04-29_全国_国家发展改革委;国家能源局_【关于印发《电力辅助服务市场基本规则》的通知(发改能源规〔2025〕411号)】-国家发展和改革委员 市委金融办、重庆金融监管局） 五、智能网联新能源商用车保险激励 支持保险机构加强与商用车整车企业的合作，针对智能网联新能源商用车优化商业车险产品，对承保本年度新上牌智能网联新能源商用车按照保费金额的10%给予保险机构激励，单个保险机构年度激励金额不超过500万元。（责任单位：市经济信息委、市委金融办、重庆金融监管局） 六、新能源商用车海外认证检测费用激励 对新能源商用车整车及其关键零部件获得出口目标国家（地区）认证的商用车整车企业，按照相关出口产品认证检测费用的10%给予激励，单个企业年度激励金额不超过300万元。（责任单位：市经济信息委、市商务委） 本政策措施所列激励标准均为最高标准，按照年度实际需求实行预算管理和总额控制。同一申报主体同一内容的事项与市级其他同类政策有重叠的，按照“就高、不重复”的原则予以支持。本文件自公布之日起30日后施行，政策措施从2025年1月1日起算，有效期截至2027年12月31日。 重庆市经济和信息化委员会发布 中国政府网 工业和信息化部网站 重庆市人民政府网站 市级部门相关网站 市发展改革委 市教委 市科技局 市经济信息委 市民族宗教委 市公安局 市民政局 市司法局 市财政局 市人力社保局 市规划自然资源局 市生态环境局 市住房城乡建委 市城市管理局 市交通运输委 市水利局 市农业农村委 市商务委 市文化旅游委 市卫生健康委 市应急管理局 市审计局 市政府外办 市国资委 市市场监管局 市体育局 市统计局 市机关事务局 市地方金融局 市信访办 市国防动员办 市公共资源交易监管局 市林业局 市药监局 市知识产权局 西部科学城重庆高新区管委会 万盛经开区管委会 重庆经开区管委会 市供销合作社 委属单位网站 重庆工信职业学院 重庆市工业学校 四川仪表工业学校 重庆市轻工业学校 重庆市机械高级技工学校 重庆市工业高级技工学校 重庆市工贸高级技工学校 重庆铁路运输技师学院 重庆市能源利用监测中心 （重庆市节能技术服务中心） 重庆市制造业人才服务中心（重庆市工业设计促进中心、重庆市工业展览馆） 重庆市工业和信息化发展中心（重庆国际电子商务交易认证中心、智博会秘书处） 重庆市中小企业发展服务中心 重庆信息通信研究院 网站地图 | 版权声明 | 联系我们 版权所有：重庆市经济和信息化委员会 主办：重庆市经济和信息化委员会 网站标识码 5000000047 ICP备案号：渝ICP备10019353号-6 渝公网安备 50019002501621号 重庆市两江新区云杉南路12号 邮政编码：401121 电话：023-63899510 023-63899777 官方微信", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260425-509BB407AE", "title": "关于下达天津市2023-2024年度电力需求响应资金计划的通知_委局文件_政务公开", "department": "天津市工业和信息化局", "collection_source": "天津市工业和信息化局", "publish_date": "2025-12-11", "document_number": "津工信电力〔2025〕13号", "regions": ["天津"], "provinces": ["天津"], "source_type": "官方政策", "policy_level": "", "topics": ["需求响应"], "keywords": ["需求响应"], "authority": "A", "time_sensitivity": "长期有效型", "status": "现行有效", "is_original": "是", "url": "https://gyxxh.tj.gov.cn/ZWGK4147/ZCWJ6355/wjwj/202512/t20251211_7197066.html", "local_paths": "01_原始资料\\官方政策\\2025-12-11_天津_天津市工业和信息化局_关于下达天津市2023-2024年度电力需求响应资金计划的通知_委局文件_政务公开.html; 03_处理后文本\\2025-12-11_天津_天津市工业和信息化局_关于下达天津市2023-2024年度电力需求响应资金计划的通知_委局文件_政务公开.txt", "text_path": "03_处理后文本\\2025-12-11_天津_天津市工业和信息化局_关于下达天津市2023-2024年度电力需求响应资金计划的通知_委局文件_政务公开.txt", "summary": "", "note": "关于下达天津市2023  "note": "关于印发《四川省深化新能源上网电价市场化改革实施方案》的通知(川发改价格〔2025〕480号)", "ingested_at": "2026-04-25", "review_status": "待人工复核", "snippet": "四川省发展和改革委员会 便民日历 智能问答 无障碍 个人中心 繁體 网站支持ipv6 搜 索 首页 新闻中心 政府信息公开 政务服务 发改工作 党建工作 互动交流 专题专栏 数据发布 当前位置： 首页 > 政策 > 其他文件 索 引 号 ： 082824954-2025-000022 公文种类： 通知 发布机构： 四川省发展和改革委员会 四川省能源局 成文日期： 2025-09-29 发布日期： 2025-09-30 文 号： (川发改...", "text": "四川省发展和改革委员会 便民日历 智能问答 无障碍 个人中心 繁體 网站支持ipv6 搜 索 首页 新闻中心 政府信息公开 政务服务 发改工作 党建工作 互动交流 专题专栏 数据发布 当前位置： 首页 > 政策 > 其他文件 索 引 号 ： 082824954-2025-000022 公文种类： 通知 发布机构： 四川省发展和改革委员会 四川省能源局 成文日期： 2025-09-29 发布日期： 2025-09-30 文 号： (川发改价格〔2025〕480号) 有 效 性 ： 有效 关于印发《四川省深化新能源上网电价市场化改革实施方案》的通知(川发改价格〔2025〕480号) 各市（州）发展改革委（能源局、办）、电力运行主管部门，国网四川省电力公司，四川电力交易中心有限公司，地方电网企业，各市场主体： 为全面贯彻落实党的二十届三中全会精神，深化新能源上网电价市场化改革，根据国家发展改革委、国家能源局《关于深化新能源上网电价市场化改革 促进新能源高质量发展的通知》（发改价格〔 2025 〕 136 号），结合我省实际，省发展改革委、省能源局研究制定了《四川省深化新能源上网电价市场化改革实施方案》，现印发你们，请抓好贯彻执行。 四川省发展和改革委员会 四川省能源局 2025 年 9 月 29 日 四川省深化新能源上网电价市场化改革 实施方案 为全面贯彻落实党的二十届三中全会精神，统筹能源安全保障与绿色低碳发展，深化新能源上网电价市场化改革，加快构建新型电力系统，根据国家发展改革委、国家能源局《关于深化新能源上网电价市场化改革 促进新能源高质量发展的通知》（发改价格〔 2025 〕 136 号），结合我省实际制定本实施方案。 一、总体目标 坚持市场化改革方向，建立适应四川新能源发展特点的可持续发展价格结算机制，推动风电、光伏新能源上网电量全面参与电力市场交易，确保 2025 年底前实现新能源上网电价全面市场化，促进新能源行业高质量发展。 二、基本原则 坚持深化改革。 进一步深化新能源上网电价市场化改革，新能源项目（包括集中式光伏、分布式光伏、集中式风电、分散式风电，下同）上网电量原则上全部进入电力市场，上网电价通过市场交易形成。 坚持分类施策。 针对新能源存量和增量项目分类施策，综合考虑经济发展需要和电力用户承受能力，保障存量项目合理利益，促进增量项目公平竞争，更好发挥市场作用，确保改革平稳推进。 坚持统筹协调。 加强与电力中长期市场、现货市场、辅助服务市场机制的衔接，强化与新型储能、虚拟电厂、绿电绿证交易、电网企业代理购电等政策的协同，做好与其他类型电源价格机制的协调，推动新型电力系统建设。 三、 推动新能源上网电价全面由市场形成 （一）推动新能源上网电量参与市场交易。 国网四川省电力公司（以下简称“国网四川电力 ” ）、地方电网、增量配电网供区内新能源项目，上网电量原则上全部进入电力市场，上网电价全部通过市场交易形成。 （二）建立健全电力现货市场交易和价格机制。 建立 “ 多电源参与、全电量优化、全水期覆盖 ” 的电力现货市场。推动新能源公平参与实时市场、自愿参与日前市场，日前市场出清不结算。具备条件的集中式新能源项目 “ 报量报价 ” 参与现货市场，具备条件的分布式光伏或分散式风电项目可直接 “ 报量报价 ” 参与现货市场，也可聚合后 “ 报量报价 ” 或 “ 报量不报价 ” 参与现货市场。不具备条件的新能源项目以 “ 不报量不报价 ” 的方式作为现货市场价格接受者。适时建立节点边际电价机制，现货市场价格上限综合考虑我省工商业用户尖峰电价水平、边际机组变动成本、用户承受能力等因素确定，价格下限综合考虑新能源在电力市场外可获得的财政补贴、绿色环境价值、碳交易市场等其他收益确定。完善分时电价机制，动态调整峰谷时段划分。 （三）完善电力中长期市场交易和价格机制。 缩短中长期市场交易周期，进一步提高交易频次，实现逐日开市。现货市场连续结算试运行前，新能源项目全电量参与中长期交易。现货市场连续结算试运行后，机制电量初期由电网企业代表全体用户与新能源项目按年度签订中长期合同，合同价格为中长期结算参考点价格。电力市场供需双方可结合新能源出力特点，合理确定机制电量外其他电量中长期合同的量价、交易曲线等内容并灵活调整。探索新能源发电企业与电力用户签订多年期购电协议，提前管理市场风险，形成稳定供求关系。建立健全分布式光伏和分散式风电项目参与中长期市场交易规则，加强分布式聚合商监督管理。 （四）完善电力辅助服务市场价格机制。 完善省内辅助服务市场品种，健全调频辅助服务市场，建立备用辅助服务市场，鼓励新能源参与辅助服务市场。现货市场连续结算试运行后，调频、备用等辅助服务市场费用分摊主体和分摊方式按我省电力辅助服务市场相关规则执行，参与省内电能量市场交易的新能源上网电量不再分摊。 四、建立健全支持新能源高质量发展的制度机制 （五）建立新能源可持续发展价格结算机制。 新能源参与电力市场交易后，在市场外建立可持续发展价格结算机制。对纳入机制的电量（以下简称“机制电量 ” ），由电网企业按照可持续发展价格（以下简称“机制电价 ” ）与市场交易均价之差开展差价结算（差价为负数时，在发电企业市场化结算费用中作相应扣除）。现货市场连续结算试运行后，初期机制电量不再开展其他形式的差价结算。新能源项目法人依规完成变更手续的，不影响可持续发展价格结算机制执行。 电网企业每月对机制电量开展差价结算，结算费用纳入系统运行费用，并以 “ 新能源可持续发展价格结算机制差价结算费用 ” 科目列示，由全省工商业用户分摊或分享（不含藏区留存电量、弃水电量消纳、原低价区当地小水电保障电量），电网企业相应完善代理购电公告信息。机制电量差价结算中的市场交易均价，在我省现货市场连续结算试运行前，根据省内当月月度和月内电能量集中交易加权均价确定；现货市场连续结算试运行后，根据同类型（分为光伏、风电，下同）发电项目结算采用的实时市场价格按月加权确定。省发展改革委根据现货市场建设情况适时调整市场交易均价确定方式。 如新能源项目月度实际上网电量低于当月分解的机制电量，按实际上网电量结算，剩余的机制电量在年内后续月份逐月滚动清算。若年底仍未达到年度机制电量规模，则缺额部分电量不再开展机制电量差价结算，不跨年滚动清算。 （六）存量新能源项目机制电量、电价和执行期限。 存量新能源项目是指 2025 年 6 月 1 日前投产的新能源项目。 1. 机制电量 存量集中式新能源项目（不含甘孜州 2020 年南部光伏基地正斗一期竞争配置项目）年度机制电量上限规模按照现行新能源项目优先电量规模（风电 400 小时，光伏 300 小时）确定，其中存量集中式扶贫新能源项目机制电量按实际上网电量确定。存量集中式新能源项目（不含甘孜州 2020 年南部光伏基地正斗一期竞争配置项目） 2025 年机制电量参照《 2025 年全省电力电量供需平衡方案及节能调度 优先 电量规模计划》中明确的原则进行分解， 2026 年起机制电量的分解结合年度电力电量平衡方案，原则上平均分解至 12 个月。 存量 分布式光伏和分散式风电项目机制电量原则上按实际上网电量确定。 2. 机制电价 存量新能源项目（不含甘孜州 2020 年南部光伏基地正斗一期竞争配置项目）机制电价按现行燃煤发电基准价 0.4012 元 / 千瓦时（含税，下同）执行。 3. 执行期限 存量新能源项目机制电量和电价自本方案印发次月起执行，机制执行截止日期按照剩余全生命周期合理利用小时数对应日期和投产满 20 年对应日期的较早者确定。 甘孜州 2020 年南部光伏基地正斗一期竞争配置项目（调度名：兴川）枯、平水期各月机制电量规模按照实际上网电量确定，丰水期不设机制电量。机制执行期限内不可自行调整或选择退出。机制电价及机制执行期限按照竞争性配置相关政策执行。 存量集中式新能源项目 年度机制电量 上限规模信息另文明确。存量分布式和分散式新能源项目信息通过 “ 新能源云 ” 服务平台、 “ 网上国网 ”APP 、 95598 网站进行公布，各电网企业同步在官方网站和 APP 进行公布。在 年度机制电量 上限范围内，新能源项目（不含甘孜州 2020 年南部光伏基地正斗一期竞争配置项目、存量扶贫光伏项目、存量分布式光伏项目、存量分散式风电项目）每年 11 月底前自主确定次年机制电量规模，次年机制电量规模不得高于当年，机制执行期限内可自愿申请退出。自愿退出的新能源项目，应提前 15 个工作日向所在电网企业申请，申请退出后次月起不再执行机制电量、电价相关政策。新能源项目机制执行到期，或者在期限内自愿退出的，均不再纳入机制执行范围。鼓励新能源项目通过设备更新改造升级等方式提升竞争力，主动参与市场竞争。 （七）增量新能源项目机制电量、电价和执行期限。 增量新能源项目是指 2025 年 6 月 1 日及以后投产的新能源项目。增量新能源项目机制电量和电价通过竞价形成，区分风电、光伏开展竞价，若参与竞价申报的同类型不同法人竞价项目不足 3 个，该类型新能源项目当年暂不组织竞价。 1. 机制电量竞价规模 增量新能源项目机制电量年度总规模综合当年增量新能源项目装机容量、合理利用小时数、用户承受能力、非水电可再生能源电力消纳责任权重完成情况等因素确定。针对风电、光伏分别确定增量新能源项目机制电量，为确保政策平稳过渡， 2025 年、 2026 年全省增量新能源项目机制电量年度竞价总规模，按存量项目 优先 利用小时数和增量装机规模确定，各增量新能源项目 年度机制电量 通过竞价形成。单个新能源项目申报电量规模不高于其发电能力的 80% ，并结合可持续发展价格结算机制情况调整。集中式新能源项目发电能力按项目核准（备案）多年平均发电量（若无多年平均发电量，则按多年平均利用小时数 × 核准或备案装机容量确定，下同）确定，项目核准（备案）中无多年平均发电量、多年平均利用小时数等信息的，集中式风电项目按项目申请报告评审意见（若无，按项目申请报告）的多年平均发电量确定，集中式光伏项目按可研评审意见的多年平均发电量确定；分散式风电、分布式光伏项目发电能力按项目所在市（州）近 3 年（过去 3 个自然年，下同）单位装机年平均上网电量（区分全额上网或余电上网模式）和项目装机容量确定。 纳入机制的增量新能源项目， 2025 年机制电量参照《 2025 年全省电力电量供需平衡方案及节能调度 优先 电量规模计划》中明确的原则进行分解， 2026 年起机制电量结合年度电力电量平衡方案，原则上平均分解至 12 个月。 2. 机制电价竞价上下限 建立新能源项目发电成本常态化调查制度，根据项目合理成本收益、绿色环境价值、电力市场供需形势、用户承受能力、技术发展等因素合理确定竞价上下限。考虑政策衔接， 2025 年、 2026 年增量新能源项目竞价上下限分别按 0.4012 元 / 千瓦时、 0.2 元 / 千瓦时确定。后续年度竞价上下限水平另行明确。 3. 执行期限 增量新能源项目机制电量和电价自省发展改革委、省能源局公布竞价结果次月起执行，其中未投产项目自项目申报的投产时间次月起执行，执行期限 12 年。 新能源项目每年 11 月底前自主确定次年机制电量规模，次年机制电量规模不得高于当年，机制执行期限内可自愿申请退出。新能源项目机制执行到期，或者在期限内自愿退出的，均不再纳入机制执行范围。项目实际投产时间较竞价申报投产时间延迟不超过 6 个月的，实际投产日期当月及以前的机制电量自动失效、不滚动纳入后续月份；延迟超过 6 个月的，该项目当次竞价入选结果作废，且 3 年内不得参与竞价。在川能源企业要加强下级企业管理，避免延期投产的情况出现。 五、强化政策衔接协同 （八）强化与新能源发展规划政策协同。 加强电网和电源规划统筹协调、网源建设衔接，保障新能源项目和配套送出工程同步规划、同步建设、同步投运。享有财政补贴的新能源项目，全生命周期合理利用小时数内的补贴标准，按照原有规定执行。新能源参与市场后因自身报量报价等因素未上网电量，不纳入新能源利用率统计与考核。强化改革与优化环境协同，各地不得以强制或变相自愿配套产业、化解债务、收取资源税（费）、约定电价分成等任何形式增加新能源项目非技术性投资和运营成本。 （九）强化与储能发展政策协同。 取消新能源项目强制配储（包含配建和租赁）相关规定，不得将配置储能作为新建新能源项目核准、并网、上网等的前置条件，通过释放电力市场电价信号，引导新能源项目科学合理配置储能。对于已签订储能租赁合同（协议）的，按双方约定等妥善处理，合同（协议）变更后应及时变更备案信息。 按照省发展改革委、省能源局《关于促进新型储能积极健康发展的通知》（川发改能源〔 2024 〕 665 号）要求配储的新能源项目，衔接原 优先 电量政策，给予机制电量支持。对 2025 年 6 月 1 日前签订储能租赁合同（协议）并在省能源局或电力交易平台备案的存量新能源项目，且相关储能项目在 2025 年 12 月 31 日前建成并网（以调度机构出具的首次并网时间证明为准），给予 36 个月机制电量政策支持， 6 月 1 日前建成并网的，自 6 月 1 日起执行，并扣除该项目已支持原 优先 电量的对应月数； 6 月 1 日后建成并网的，自储能项目建成并网次月起执行，并扣除该项目已支持原 优先 电量的对应月数。对电源侧配建储能的存量新能源项目，自储能设施建成并网次月至电力现货市场连续结算试运行前，给予每月机制电量支持。上述配储的新能源项目月度支持机制电量， 2025 年参照《 2025 年全省电力电量供需平衡方案及节能调度 优先 电量规模计划》中明确的支持小时数和分解原则确定， 2026 年起按 12.5 小时确定。 通过租赁储能和电源侧配建储能综合满足以上要求的存量新能源项目，按租赁和电源侧配建储能容量占项目 10% 装机容量的比例折算每月支持的机制电量，并按上述期限分别执行，单个存量新能源项目每月支持的机制电量上限， 2025 年参照《 2025 年全省电力电量供需平衡方案及节能调度 优先 电量规模计划》中明确的支持小时数和分解原则确定， 2026 年起按 12.5 小时确定。 推动实现新能源场站和配建储能联合参与市场，利用储能改善新能源涉网性能，保障新能源高效利用。 （十）强化与电网企业代理购电制度衔接。 新能源全部进入电力市场后，电网企业代理居民农业和工商业用户购电的电量来源缺口部分，通过市场化采购方式保障。作为价格接受者参与电力市场的分布式光伏和分散式风电项目，现货市场连续结算试运行前，其上网电量按省内当月月度和月内电能量集中交易加权均价结算。 （ 十一 ）加强地方电网、增量配电网相关政策衔接。 地方电网、增量配电网余电上网价格，现货市场连续结算试运行前，按照 省内当月月度和月内电能量集中交易加权均价确定；现货市场连续结算试运行后，按照上网所在并网点实时市场出清价格确定。 地方电网、增量配电网网内新能源项目机制电量差价结算费用通过网间电费结算传导，纳入系统运行费用。 （十二）强化与绿电绿证交易政策协同。 省内绿电交易不单独组织集中竞价、滚动撮合交易。绿电交易申报和成交价格应分别明确电能量价格和相应绿色电力证书价格。绿电交易的绿证收益，按照合同电量、扣除机制电量后剩余上网电量以及电力用户绿电交易实际结算电量三者取小值确定。探索建立多年期绿电合同签订机制，引导新能源发电企业根据机制外电量发电能力，与用户签订多年期绿电交易合同。纳入可持续发展价格结算机制的电量，不重复获得绿证收益。 六、保障措施 （十三）凝聚改革共识。 各地价格、能源、电力运行主管部门要深刻领会新能源上网电价市场化改革精神，会同电网企业、市场运营机构加强政策宣传解读，帮助企业熟悉电力市场规则，及时回应社会关切，增进各方理解和支持。市场主体要充分认识改革重要意义，不断凝聚以改革推动新能源高质量发展、促进新型电力系统建设、加快全国统一电力市场建设的共识。 （十四）强化政策执行。 国网四川电力要加快建设机制电量和电价竞价系统，各电网企业按要求做好竞价组织、相关差价结算协议（合同）签订、新能源项目上网电费和差价电费结算等工作，对机制电量和电价执行情况单独归集，并按月做好相关信息公开。市场主体要自觉维护电力市场秩序，依法合规参与电力市场交易和机制电量电价竞价。市场运营机构要强化交易组织，按规定及时披露各类型新能源发电项目市场交易价格等信息。 （ 十五 ）建立常态化调查制度。 统筹考虑各类电源发电特性、技术革新等因素，建立发电和储能等成本常态化调查制度，区分机组类型，对发电项目固定成本、变动成本、启停成本等开展调查，为合理确定电力市场限价范围、机制电量电价竞价限价区间、执行期限等提供数据支撑。 （十六）加强风险防控。 配合国家能源局派出机构加强市场行为监管，保障新能源项目公平参与交易，促进电力市场平稳运行。电网企业、市场运营机构要密切跟踪电力市场和新能源交易价格，每月评估分析市场交易价格水平、波动情况，及时发现苗头性、倾向性、潜在性问题，提出针对性措施建议，并向省发展改革委、省能源局报告，对操纵市场价格、串通报价等扰乱市场秩序行为，依法依规予以严肃处理，确保新能源上网电价市场化改革平稳有序推进。 （十七）做好跟踪评估。 省发展改革委、省能源局会同相关部门（单位）密切跟踪电力市场运行情况、新能源发电成本和收益变化、终端用户电价水平等，组织力量系统评估改革对行业发展和企业经营等方面影响，及时总结改革成效，不断完善政策措施、优化政策实施，持续增强市场价格信号对新能源发展的引导作用。适时对新能源可持续发展价格结算机制进行评估优化，条件成熟时择机退出。 本方案自印发之日起执行，现行政策与本方案不符的，以本方案规定为准。国家和省政策如有调整，从其规定。执行过程中遇到问题，请及时报告省发展改革委、省能源局。 附件 :1 . 四川省增量新能源项目机制电量电价竞价细则 2. 四川省新能源项目机制电量结算细则 扫一扫在手机打开当前页 点击下载此文件 相关链接： 《四川省深化新能源上网电价市场化改革实施方案》政策解读 zcjdu 《四川省深化新能源上网电价市场化改革实施方案》政策解读 回到 顶部 友情链接： 领导机关 中国政府网 国家发展和改革委员会 四川省人大常委会 四川省人民政府 政协四川省委员会 部门管理单位 四川省粮食和物资储备局 四川省工程咨询研究院 相关链接 四川 信息披露工作， 进一步满足市场经营主体信息需求， 维护市场 经营 主体合法权益，依据《电力监管条例》 （ 中华人民共和国国务院令第 432 号 ）《国家发展改革委 国家能源局关于加快建设全国统一电力市场体系的指导意见》（发改体改〔 2022 〕 118 号）《 电力企业信息披露规定 》 等有关规定 ， 结合电力市场 实践 ，制定本 规则 。 第二条 本 规则 所称电力市场包含 电力中长期 、 现货、 辅助服务市场等。 第三条 本 规则 所称 信息披露 主体包括发电企业、售电公司、电力用户、新型主体（ 独立 储能等）、电网企业和市场运营机构。市场运营机构包括电力交易机构和电力调度机构。 第四条 本 规则 所称信息披露是指 信息披露 主体提供、发布与电力市场相关信息的行为。 第五条 各地区根据电力市场运营情况，若存在无法满足本规则要求的信息披露内容，有关信息披露主体应向国家能源局或其派出机构书面报备。 第二章 信息披露 原则和方式 第六条 信息披露应当遵循 安全、 真实、准确、完整、及时、易于使用的原则。 第七条 信息披露 主体 应严格按照本规则要求披露信息，并 对其 披露 信息的真实性、准确性、完整性、及时性负责。 第八条 电力交易机构负责电力市场信息披露的实施，以电力交易 平台为基础设立 信息 披露 平台 ，做好国家能源局及其派出机构、政府相关部门、市场经营主体信息披露平台登录账号运维管理工作。 电力交易机构制定 全国统一的 信息披露标准 数据 格式 ，在保障信息安全的前提下提供 数据接口 服务 。 相关数据接口标准另行制定。 第九条 信息披露 主体按照标准 数据 格式 在 信息披露平台 披露 信息 ，披露的信息保留或可供查询的时间不少于 2 年 。 信息披露应以结构化数据为主，非结构化信息采用 PDF 等文件格式。 第十条 电力市场信息应在信息披露平台上进行披露，在确保信息安全基础上，按信息公开范围要求，可同时通过信息发布会、交易机构官方公众号等渠道发布。 第十一条 电力市场信息按照年、季、月、周、日等周期开展披露。预测类信息在交易申报开始前披露，运行类信息在运行日次日披露。现货未开展的地区或时期，可根据市场运行需要披露周、日信息，现货市场不结算试运行期间暂不披露现货市场相关信息。 第十二条 涉及多省业务的信息披露主体应以法人为主体披露其全量及分省信息。 第十三条 市场成员对披露的信息内容、时限等有异议或者疑问，可向电力交易机构提出，电力交易机构根据本规则规定要求相关信息披露 主体 予以解释及配合。 第三章 信息披露内容 第十四条 按照信息公开范围，电力市场信息分为公众信息、公开信息 、特定 信息 三 类。 （一）公众信息：是指向社会公众披露的信息。 （二）公开信息：是指向 有关市场成员 披露的信息。 （三） 特定信息 ：是指 根据电力市场运营需要 向特定 市场成员 披露的信息。 第一节 发电企业 第十五条 发电企业应当披露的公众信息包括： （一） 企业全称、 企业性质、 所属集团、工商注册时间、统一社会信用代码、 股权结构、 法定代表人、电源类型、装机容量、联系方式等。 （二） 企业变更情况，包括企业更名或法定代表人变更 ， 企业 增 减资、合并、分立、解散及申请破产的决定 ， 依法进入破产程序、被责令关闭等重大经营信息。 （三） 与其他市场 经营 主体之间的 股权 关联 关系 信息。 （四） 其他政策法规要求向社会公众 披露 的信息。 第十六条 发电企业应当披露的公开信息包括： （一） 电厂机组信息，包括电厂调度名称 、 所在地 市、 电力业务许可证（发电类）编号 、 机组调度管辖关系 、 投运机组台数 、 单机容量及类型 、 投运日期 、 接入电压等级 、 单机最大出力 、机组出力受限的技术类型（如流化床、高背压供热）、 抽蓄机组最大及最小抽水充电能力、静止到满载发电及抽水时间 等。 （二） 配建储能信息（如有）。 （三） 机组出力受限情况。 （四） 机组检修及设备改造计划。 第十七条 发电企业应当向特定 市场成员 披露 的特定信息 包括： （一） 市场交易申报信息、合同信息。 （二） 核定（设计）最低技术出力 ， 核定（设计）深调极限出力 ， 机组爬坡速率 ， 机组边际能耗曲线 ， 机组最小开停机时间 ， 机组预计并网和解列时间 ， 机组启停出力曲线 ， 机组调试计划曲线 ， 调频、调压、日内允许启停次数 ， 厂用电率 ， 热电联产机组供热信息等机组性能参数。 （三） 机组实际出力和发电量、上网电量、计量点信息等。 （四） 发电企业燃料供应情况、燃料采购价格、存储情况、供应风险等。 （五） 发电企业批发市场月度售电量、售电均价。 （六） 水电、新能源机组发电出力预测。 第二节 售电公司 第十八条 售电公司应当披露的公众信息包括： （一） 企业全称、企业性质、售电公司类型、工商注册时间、注册资本金、统一社会信用代码 、股权结构、经营范围、 法定代表人、联系方式、 营业场所地址、 信用承诺书等。 （二） 企业资产信息，包括资产证明方式、资产证明出具机构、报告文号（ 编号 ）、报告日期、资产总额、实收资本总额等 。 （三） 从业人员 信息 ，包括从业人员数量、职称及社保缴纳人数等 。 （四） 企业变更情况， 包括企业更名或法定代表人变更， 企业 增 减资、合并、分立、解散及申请破产的决定，或者依法进入破产程序、被责令关闭等重大经营信息， 配电网运营资质变化 等 。 （五） 售电公司年报信息 ，内容 包括但不限于企业基本情况、持续满足市场准入条件情况、 财务情况 、经营状况、业务范围、 履约情况 、 重大事项 ， 信用 信息 、竞争力 等 。 （六） 售电公司 零售 套餐 产品 信息 。 （七） 与其他市场 经营 主体之间的 股权 关联关系信息。 （八） 其他政策法规要求向社会公众 披露 的信息。 第十九条 售电公司应当披露的公开信息包括： （一） 履约保函、保险缴纳 金额、有效期等 信息。 （二） 拥有配电网运营权的售电公司应当披露电力业务许可证（供电类）编号、配电网电压等级、配电区域、配电价格等信息。 （三） 财务审计报告 （ 如有 ）。 第二十条 售电公司应当向特定 市场成员 披露 的特定信息 包括： （一） 市场交易申报信息。 （二） 与代理用户签订的购售电合同信息或者协议信息。 （三） 与发电企业签订的交易合同信息。 （四） 售电公司批发侧月度结算电量、结算均价。 （五） 可参与系统调节的响应能力和响应方式等。 第三节 电力用户 第二十一条 电力用户应当披露的公众信息包括： （一） 企业全称、企业性质、行业分类、用户类别、工商注册时间、统一社会信用代码、法定代表人、联系方式、 经营范围 、所属行业等。 （二） 企业变更情况，包括 企业更名或法定代表人变更， 企业 增 减资、合并、分立、解散及申请破产的决定，依法进入破产程序、被责令关闭等重大经营信息。 （三） 与其他市场 经营 主体之间的 股权 关联关系信息。 （四） 其他政策法规要求向社会公众 披露 的信息。 第二十二条 电力用户应当披露的公开信息包括： （一） 企业用电类别、接入地 市 、用电电压等级、自备电源（如有）、变压器报装容量以及最大需量等。 （二） 配建储能信息（如有）。 第二十三条 电力用户应当向特定 市场成员 披露 的特定信息 包括： （一） 市场交易申报信息。 （二） 与发电企业、售电公司签订的购售电合同信息或协议信息 。 （三） 企业 用电信息，包括用电户号、用电户名、结算户号、 用 电量 及 分时用电数据、计量点信息等。 （四） 可参与系统调节的响应能力和响应方式等。 （五） 用电需求信息，包括月度、季度、年度的用电需求安排。 （六） 大型电力用户计划检修信息。 第四节 新型主体 第二十四条 独立储能 应当披露的公众信息包括： （一） 企业全称、企业性质、 额定容量、 工商注册时间、统一社会信用代码、股权结构 、 经营范围 、 法定代表人、联系方式等。 （二） 企业变更情况，包括 企业更名或法定代表人变更 ， 企业 增 减资、合并、分立、解散及申请破产的决定 ， 依法进入破产程序、被责令关闭等重大经营信息。 （三） 与其他市场 经营 主体之间的 股权 关联关系信息。 （四） 其他政策法规要求向社会公众 披露 的信息。 第二十五条 独立储能 应当披露的公开信息包括： （一） 调度名称、调度管辖关系、投运日期、接入电压等级、机组技术类型（电化学、压缩空气等）、所在地市。 （二） 满足参与市场交易的相关技术参数，包括额定充（放）电功率、额定充（放）电时间、最大可调节容量、最大充放电功率、最大持续充放电时间等。 第二十六条 独立储能 应当向特定 市场成员 披露 的特定信息 包括： （一） 市场交易申报信息、合同信息 。 （二） 性能参数类信息，包括提供调峰、调频、旋转备用等辅助服务的持续响应时长 ， 最大最小响应能力、 最大上下调节功（速）率、充放电爬坡速率 等 。 （三） 计量 信息，包括户名、 发电户号、用电户号 、结算户号、计量点信息、 充放电电力 电量等信息。 第二十七条 虚拟电厂、负荷聚合商等其他新型主体信息披露要求根据市场发展需要另行明确。 第五节 电网企业 第二十八条 电网企业应当披露的公众信息包括： （一） 企业全称、企业性质、工商注册时间、统一社会信用代码、法定代表人、联系方式、供电区域等。 （二） 与其他市场经营主体之间的股权关联关系信息。 （三） 政府定价信息，包括输配电价、政府核定的输配电线损率、各类政府性基金及其他市场相关收费标准等。 （四） 代理购电信息，包括代理购电电量及构成、代理购电电价及构成、代理购电用户分电压等级电价及构成等。 （五） 其他政策法规要求向社会公众披露的信息。 第二十九条 电网企业应当披露的公开信息包括： （一） 电力业务许可证（输电类、供电类）编号。 （二） 发电机组装机、电量及分类构成（含独立储能）情况。 （三） 年度发用电负荷实际情况。 （四） 全社会用电量及分产业用电量信息（转载披露）。 （五） 年度电力电量供需平衡预测及实际情况。 （六） 输变电设备建设、投产情况。 （七） 市场经营主体电费违约总体情况。 （八） 需求响应执行情况。 第三十条 电网企业 应当向特定 市场成员 披露 的特定信息 包括 ： （一） 向电力用户披露历史用电数据、用电量等用电信息。 （二） 经电力用户授权同意后，应允许市场经营主体获取电力用户历史用电数据、用电量等信息。 第 六 节 市场运营 机构 第三十一条 市场运营 机构应当披露的 公众 信息包括： （一） 电力交易机构全称、工商注册时间、股权结构、统一社会信用代码、法定代表人、 服务电话 、办公地址、网站网址等。 （二） 电力市场公开适用的法律法规、政策文件 、规则细则类信息 ，包括交易规则、交易相关收费标准，制定、修订市场规则过程中涉及的解释性文档等。 （三） 业务标准规范，包括注册流程、争议解决流程、 负荷预测方法和流程、辅助服务需求计算方法、电网安全校核规范、电力市场 服务指南、数据通讯格式规范等。 （四） 信用信息，包括市场经营主体电力交易信用信息（经政府部门同意）、售电公司违约情况等 。 （五） 电力市场运行情况，包括市场注册、交易总体情况。 （六） 强制或自愿退出且公示生效后的市场经营主体 名单。 （七） 市场 结构 情况 ，可采用 HHI 、 Top-m 等指标 。 （八） 市场暂停、中止、重新启动等情况。 （九） 其他 政策 法规要求向社会公众 披露 的信息。 第三十二条 市场运营 机构应当披露的公开信息包括： （一） 报告信息，包括 信息披露报告 等 定期报告 、 经国家能源局派出机构或者 地方政府 电力 管理 部门认定的违规行为通报 、 市场干预情况 、电力现货市场第三方校验报告、经审计的收支总体情况（收费的电力交易机构披露）等 。 （二） 交易日历，包括多年、年、月、周、多日、日各类交易安排。 （三） 电网主要网络通道示意图。 （四） 约束信息，包括发输变电设备投产、检修、退役计划，关键断面输电通道可用容量，省间联络线输电可用容量，必开必停机组名单及总容量，开停机不满最小约束时间机组名单等。 （五） 参数信息，包括市场出清模块算法及运行参数、价格限值、约束松弛惩罚因子、节点分配因子及其确定方法、节点及分区划分依据和详细数据等。 （六） 预测信息，包括系统负荷预测、电力电量供需平衡预测、省间联络线输电曲线预测、发电总出力预测、非市场机组总出力预测、新能源（分电源类型）总出力预测、水电（含抽蓄）出力预测等 。 （七） 辅助服务需求信息，包括各类辅助服务市场需求情况，具备参与辅助服务市场的机组台数及容量、用户及售电公司总体情况。 （八） 交易公告， 包括 交易品种、 经营 主体、交易方式、 交易申报时间 、交易 合同执行 开始时间及终止时间、交易参数、 出清方式、 交易约束信息、交易 操作说明、 其他准备信息等 必要信息 。 （九） 中长期交易申报及成交情况 ，包括参与的主体 数量 、申报 电量 、成交的主体 数量 、最终成交 总量及分电源类型电量、成交均价及分电源类型均价、 中长期交易安全校核结果及原因 等 。 （十） 绿电交易申报及成交情况， 包括参与的主体 数量 、申报 电量 、成交的主体 数量 、最终成交 总量、成交均价 等 。 （十一） 省间月度 交易计划。 （十二） 现货、辅助服务市场申报出清信息， 包括各时段出清 总 量 及分类电源中标台数和电量、出清电价、输电断面约束及阻塞情况等 。 （十三） 运行信息，包括 机组状态、 实际负荷 、 系统备用信息，重要通道实际输电情况 、 实际运行 输电 断面约束情况 、 省间 联络线潮流 、 重要线路与变压器平均潮流，发 输变电设备检修计划执行情况 、 重要线路非计划停运情况、发电机组非计划停运情况， 非市场机组实际出力曲线 ， 月度发用电负荷总体情况 等。 （十四） 市场 结算 总体 情况， 包括结算总量、均价及分类构成情况，绿电交易结算情况，省间交易结算情况， 不平衡资金构成、分摊和分享情况 ，偏差考核情况 等。 （十五） 电力 并网运行管理考核和返还明细情况，包括各并网主体分考核种类的考核费用、返还费用、免考核情况等。 （十六） 电力辅助服务考核、补偿、分摊明细情况，包括各市场经营主体分辅助服务品种的电量 / 容量、补偿费用、考核费用、分摊比例、分摊费用等。 （十七） 售电公司总体经营情况，包括售电公司总代理电量、户数、批发侧及零售侧结算均价信息，各售电公司履约保障凭证缴纳、执行情况、结合资产总额确定的售电量规模限额。 （十八） 交易总体情况，包括 年度、月度、月内、 现货交易成交均价及电量 。 （十九） 发电机组转商情况，包括发电机组、独立储能完成整套设备启动试运行时间。 （二十） 到期未取得电力业务许可证的市场经营主体名单。 （二十一） 市场干预情况原始日志，包括干预时间、干预主体、干预操作、干预原因，涉及《电力安全事故应急处置和调查处理条例》（中华人民共和国国务院令第 599 号）规定电力安全事故等级的事故处理情形除外。 第三十三条 市场运营 机构应当向特定 市场成员 披露 的特定信息 包括： （一） 成交信息，包括各类交易成交量价信息。 （二） 日前省内机组预计划。 （三） 月度 交易计划 。 （四） 结算信息，包括各类交易结算量价信息、绿证划转信息、日清算单（现货市场）、月结算依据等。 （五） 争议解决结果。 第四章 披露信息调整 第三十四条 信息调整是指市场成员扩增或变更本规则规定披露的信息，包括新增披露信息，变更披露内容、披露范围 、披露周期 等。 第三十五条 市场成员 可申请扩增 或变更 信息 ， 申请人应当将申请发送至电力交易机构，内容应包括扩增 或变更 信息内容、披露范围、披露周期、必要性描述、申请主体 名称 、联系方式等。 第三十六条 电力交易机构收到 扩增或变更 信息披露申请后 在交易平台发布相关信息，征求市场成员意见。受影响的市场成员在信息发布后 7 个工作日反馈意见，电力交易机构汇总各市场成员的反馈意见并形成初步审核建议， 报 国家能源局或其派出机构 审核，审核结果通过信息披露平台公示。 第三十七条 申请 审核通过 后，电力交易机构组织相关 信息披露主体 开展披露 工作 。 第三十八条 现货市场信息如有变更应及时发布变更说明。 第五章 信息 保密和封存 第三十九条 信息披露 主体 在披露、查阅信息之前应在信息披露平台签订信息披露承诺书。信息披露承诺书中应明确信息安全保密责任与义务等条款。 第四十条 任何市场成员不得违规获取或者泄露未经授权披露的信息。市场成员的工作人员未经许可不得公开发表可能影响市场成交结果的言论。市场成员应当建立健全信息保密管理制度，定期开展保密培训，明确保密责任，必要时应当对办公系统、办公场所采取隔离措施 。 第四十一条 信息封存是指对关键信息的记录留存。任何有助于还原运行日情况的关键信息应当记录、封存。封存信息包括但不限于： （一）运行日市场出清模型信息。 （二）市场申报量价信息。 （三）市场边界信息，包括外来（外送）电曲线、检修停运类信息、预测信息、新能源发电曲线、电网约束信息等。 （四）市场干预行为，包括修改计划机组出力、修改外来（外送）电出力、修改市场出清参数、修改预设约束条件、调整检修计划、调整既有出清结果等，应当涵盖人工干预时间、干预主体、干预操作、干预原因等。 （五）实时运行数据，包括机组状态、实际负荷等。 （六）市场结算数据、计量数据 。 第四十二条 市场运营 机构应当建立市场干预记录管理机制，明确记录保存方式。任何单位或者个人不得违法违规更改已封存信息。市场干预记录应当报 国家能源局或其派出机构 备案，国家能源局 及其 派出机构定期对市场干预行为进行监管，保证市场干预行为的公平性。 第四十三条 封存的信息应当以易于访问的形式存档，存储系统应当满足访问、数据处理和安全方面的要求。 第四十四条 信息的封存期限为 5 年，特殊情形除外。 第六 章 监督 管理 第四十五条 国家能源局及其派出机构 对 市场成员的信息披露工作 进行监管。 第四十六条 电力交易机构配合国家能源局及其派出机构开展信息披露监管工作， 对未按本规则披露信息的信息披露主体，采取提醒 信息披露主体 、 报送 国家能源局或 其派出机构等方式进行管理。 第四十七条 市场成员 应按照本 规则 要求，做好电力市场信息披露工作 ，不得出现 以下行为 ： （一）信息披露不及时、不准确、不完整的。 （二）制造传播虚假信息的。 （三）发布误导性信息的。 （四）其他违反信息披露有关规定的行为。 第四十八条 对于出现以上行为的市场成员，纳入电力交易信用评价，国家能源局及其派出机构可依法依规将其纳入失信管理，采取有关监管措施，并根据《电力监管条例》等有关规定作出行政处罚。 第四十九条 国家能源局 及其 派出机构 组织电力交易机构 对 各市场成员 披露信息 的及时性、完整性、准确性等 情况作出评价，评价结果向所有 市场成员 公布。 第 七 章 附 则 第五十条 本 规则 自 2024 年 1 月 31 日 起施行 ，《电力现货市场信息披露办法（暂行） 片式/卷绕式电池生产、焊接封装、注液、化成与分容检测等工序。储能系统组装采用自产磷酸铁锂电芯，通过严格电芯选型与匹配确保一致性，采用模块化设计与激光焊接等工艺进行组装，集成具备智能充放电策略与多重安全保护的电池管理系统。 四、用能设备。 （一）主要设备。5台制氮机（功率45千瓦、2级能效），5套自动投料系统（功率120千瓦、2级能效），12台搅拌机（功率180千瓦、2级能效），6台涂布机（功率1650千瓦、2级能效），8台辊分一体机（功率90千瓦、2级能效），8台模切机（功率15千瓦，2级能效），10台自动卷绕机（功率30千瓦、2级能效），3条自动装配线（功率85千瓦、2级能效），3条自动烤箱线（功率1600千瓦、2级能效），2台一次注液机（功率45千瓦、2级能效），92台立库化成柜（功率60千瓦、2级能效），200台立库分容柜（功率90千瓦、2级能效），3台焊铆钉二次氦检（功率55千瓦，2级能效），2条自动集成电池包组装线（功率450千瓦，2级能效）。 （二）辅助设备。6台永磁变频空压机（功率325千瓦、排气压力0.8兆帕、产气量56.9立方米/分钟、2级能效），15台变压器（2台容量2500千伏安、空载损耗2.45千瓦、负载损耗14.535千瓦，13台容量3150千伏安、空载损耗1.784千瓦、负载损耗19.976千瓦，均为2级能效），27台冷水机组（10台额定制冷量375千瓦、功率65千瓦、性能系数5.77，12台额定制冷量562千瓦、功率93千瓦、性能系数6.04，5台额定制冷量312.5千瓦、功率55千瓦、性能系数5.68，均为2级能效），以及风机、水泵、照明和环保处理设施等辅助设备。 五、计量器具。 对电、天然气、水及蒸汽配备能源计量器具。项目外购能源资源进入厂区时进行一级计量，各楼栋、车间设置二级计量，主要用能设备实现三级计量。 六、项目建成后能源消费和碳排放主要指标。 项目年综合能源消费量不高于46992.70吨标准煤，其中年电力消耗量不高于23206.32万千瓦时、年天然气消耗量不高于1.90万立方米、年柴油消耗量不高于2.96吨、年蒸汽消耗量不高于201600.00吨。项目单位产品综合能耗不高于136.71千克标准煤/万安时。 项目年二氧化碳排放总量不高于154754.84吨，其中直接排放量不高于44.73吨，间接排放量不高于154710.11吨。项目单位产品碳排放量不高于0.45吨二氧化碳/万安时，单位增加值碳排放量不高于1.10吨二氧化碳/万元。 七、项目在落实节能报告各项节能降碳措施基础上，应加强和改进以下节能降碳工作： （一）工艺节能降碳。 1.涂布干燥工艺：挤压涂布机采用全电机驱动，搭配可编程逻辑控制器、变频及伺服控制技术，通过阶梯化温度控制保障产品质量并降低能耗，实现一人多机管理。 2.上料搅拌工艺：多投粉口持续作业，无需停机重启，实现无缝衔接生产，提高效率、降低能耗。 3.烘烤工艺：采用自动烤箱线，通过双层结构设计、高精度温控、分段升温等措施提高能源利用效率。 4.化成工艺：采用串联化成代替并联化成，降低充放电损耗。 （二）辅助及附属生产设施节能降碳。 1.项目主要用能产品设备能效水平满足相关标准二级能效以上要求。 2.选用低损耗节能型电力变压器，合理选配装机容量，使之在经济负荷率范围内运行；在生产区域、生产车间负荷中心设置供配电点，以就近供电；就地进行无功补偿，使功率因素在0.95以上。 3.电气照明选择合理的照度标准，严格控制照明功率密度值；选用高效LED节能灯具，充分利用自然光和太阳能光源。 （三）建筑节能降碳。 1.合理设计建筑结构和朝向，建筑布置尽量南北向，主体生产厂房东、西面外墙尽量少开窗，以减少日照对建筑影响，降低夏季冷源消耗。 2.在满足生产要求的前提下，尽可能减少外墙面积与所包围建筑体积的比值，在满足采光和通风要求的条件下，合理确定门窗面积。 （四）能源计量和管理。 1.根据《用能单位能源计量器具配备和管理通则》（GB 17167-2025）等规范，健全能源计量、监测管理制度，建立能源计量管理体系。 2.配备的电表和天然气、新水、蒸汽等介质的计量器具，精度要符合《用能单位能源计量器具配备和管理通则》（GB17167-2025）要求。 3.按照《重点用能单位节能管理办法》（2018年修订）相关要求接入全省能耗在线监测系统，定期报送能源利用状况和碳排放情况报告。 （五）其他要求。 1.项目建成投产后，应认真执行国家、省节能降碳政策要求，积极开展节能降碳技术改造，并综合采取碳排放配额交易、项目碳排放等量替代等措施减少项目碳排放。 2.项目应优先选用能效碳效标准领先的产品和设备，将能效碳效指标作为重要的技术指标列入设备招标文件和采购合同，不得使用国家明令禁止和淘汰的落后工艺及设备。 3.加强能源和碳排放管理，对企业能耗、碳排放进行实时记录、监测和分析。 八、项目建设单位、建设地点、建设规模、主要生产装置、用能设备、工艺技术路线、主要产品品种及其他方面较节能报告、节能审查意见等发生重大变化的，请按照《广东省固定资产投资项目节能审查实施办法》（粤能规〔2023〕3号）第十八条规定执行。 九、请江门首通新能源科技有限公司根据本审查意见和项目节能报告，对项目设计、施工、竣工验收以及运营管理进行有效监督检查，及时报告本审查意见落实情况和项目有关重大事项。我局按规定组织开展对节能审查意见落实情况的跟踪检查。 十、项目投入生产、使用前，请江门首通新能源科技有限公司组织对项目节能降碳相关情况进行验收，并将验收报告报我局和江门市发展和改革局留存。未按规定进行节能审查验收或验收不合格擅自投入生产、使用的，以及以提供虚假材料等不正当手段通过节能审查验收的，责令限期整改。 十一、请江门市发展和改革局积极推进重点用能单位节能降碳改造工作，加强用能预算精细化管理，为江门市后续新增耗能项目建设腾出能耗空间。 十二、本节能审查意见自印发之日起两年内有效，项目逾期未开工建设的，应重新进行节能审查和碳排放评价。 相关附件： 相关导读: 分享到： 打印文档 关闭窗口 相关网站 广东省投资项目在线审批监管平台 信用广东网 广东省招标投标监管网 粤港澳大湾区门户网 委管局/直属单位 广东省粮食和物资储备局 广东省能源局 广东省发展和改革研究院（广东省产业发展研... 广东省发展和改革委员会价格认定中心 广东省价格成本调查队 广东省价格监测中心 广东省投资和信用中心（广东省发展和改革事... 省直单位 广东省人民政府办公厅 广东省教育厅 广东省科学技术厅 广东省工业和信息化厅 广东省民族宗教事务委员会 广东省公安厅 广东省民政厅 广东省司法厅 广东省财政厅 广东省人力资源和社会保障厅 广东省自然资源厅 广东省生态环境厅 广东省住房和城乡建设厅 广东省交通运输厅 广东省水利厅 广东省农业农村厅 广东省商务厅 广东省文化和旅游厅 广东省卫生健康委员会 广东省退役军人事务厅 广东省应急管理厅 广东省审计厅 地市发改局（委） 广州市发展改革委 深圳市发展改革委 珠海市发展改革局 汕头市发展改革局 佛山市发展改革局 韶关市发展改革局 河源市发展改革局 梅州市发展改革局 惠州市发展改革局 汕尾市发展改革局 东莞市发展改革局 中山市发展改革局 江门市发展改革局 阳江市发展改革局 湛江市发展改革局 茂名市发展改革局 肇庆市发展改革局 清远市发展改革局 潮州市发展改革局 揭阳市发展改革局 云浮市发展改革局 国家及省市发改委 中华人民共和国国家发展和改革委员会 北京市发展改革委 天津市发展改革委 河北省发展改革委 山西省发展改革委 内蒙古自治区发展改革委 辽宁省发展改革委 吉林省发展改革委 黑龙江省发展改革委 上海市发展改革委 江苏省发展改革委 浙江省发展改革委 安徽省发展改革委 江西省发展改革委 福建省发展改革委 山东省发展改革委 广西壮族自治区发展改革委 湖南省发展改革委 湖北省发展改革委 河南省发展改革委 四川省发展改革委 重庆市发展改革委 云南省发展改革委 贵州省发展改革委 西藏自治区发展改革委 陕西省发展改革委 甘肃省发展改革委 青海省发展改革委 新疆维吾尔自治区发展改革委 宁夏回族自治区发展改革委 海南省发展改革委 其他链接 中国发展网 中国普法网 关于本站 | 网站地图 | 技术支持 | 联系我们 | 隐私保护 | 版权声明 主办单位：广东省发展和改革委员会 承办单位：广东省投资和信用中心 地址：广州市东风中路305号5号楼（邮编：510031） 业务咨询电话：020-12345 版权所有：广东省发展和改革委员会 未经书面授权禁止复制或建立镜像 粤ICP备2022065133号-4 粤公网安备 44010402001448号 网站标识码4400000058", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260425-2654ED23DA", "title": "广东省发展和改革委员会 - 广东省能源局关于中创新航动力电池及储能系统江门基地项目二期节能报告的审查意见", "department": "广东省能源局", "collection_source": "广东省能源局", "publish_date": "2026-03-19", "document_number": "粤能许可〔2026〕26号", "regions": ["广东"], "provinces": ["广东"], "source_type": "官方政策", "policy_level": 冷离心式冷水机组（1台功率610千瓦、制冷量3517千瓦，5台功率1223千瓦、制冷量7034千瓦，8台功率1857千瓦、制冷量11254千瓦，均为2级能效），10台锅炉（5台燃气导热油锅炉、功率90千瓦、2级能效，5台燃气蒸汽锅炉、功率45千瓦、1级能效），以及风机、水泵、照明和环保处理设施等辅助设备。 五、计量器具。 对电、天然气、水及蒸汽进行能源计量器具配备。项目外购能源资源进入厂区时进行一级计量，各楼栋、车间设置二级计量，电、天然气、水实现三级计量。 六、项目建成后能源消费和碳排放主要指标。 项目年综合能源消费量不高于183793.96吨标准煤，其中年电力消耗量不高于86356.86万千瓦时、年天然气消耗量不高于6599.21万立方米。项目锂离子电池单位产品综合能耗不高于168.69千克标准煤/万安时。 项目年二氧化碳排放总量不高于495148.02吨，其中直接排放量不高于127687.46吨，间接排放量不高于367460.56吨。项目锂离子电池单位产品碳排放量不高于0.4527吨二氧化碳/万安时，单位增加值碳排放量不高于0.8926吨二氧化碳/万元。 七、项目在落实节能报告各项节能降碳措施基础上，应加强和改进以下节能降碳工作： （一）工艺节能降碳。 1.定容工序中，电池在分容柜内进行多次充放电测试，提高产品稳定性和可靠性，放电过程中通过回馈电网，实现节能降碳。 2.采用热交换器回收负极涂布机排风的热量，达到节能降碳效果。 3.采用高效分子筛转轮，使除湿机回风温度由45摄氏度降低到40摄氏度左右，除湿后，将温度提升到50摄氏度左右送入车间，达到节能降碳效果。 （二）辅助及附属生产设施节能降碳。 1.项目主要用能产品设备能效水平满足相关标准二级能效以上要求。 2.选用低损耗节能型电力变压器，合理选配装机容量，使之在经济负荷率范围内运行；在生产区域、生产车间负荷中心设置供配电点，以就近供电；就地进行无功补偿，使功率因素在0.95以上。 3.电气照明选择合理的照度标准，严格控制照明功率密度值；选用高效LED节能灯具，充分利用自然光和太阳能光源。 （三）建筑节能降碳。 1.合理设计建筑结构和朝向，建筑布置尽量南北向，主体生产厂房东、西面外墙尽量少开窗，以减少日照对建筑影响，降低夏季冷源消耗。 2.在满足生产要求的前提下，尽可能减少外墙面积与所包围建筑体积的比值，在满足采光和通风要求的条件下，合理确定门窗面积。 （四）能源计量和管理。 1.根据《用能单位能源计量器具配备和管理通则》（GB 17167-2025）等规范，健全能源计量、监测管理制度，建立能源计量管理体系。 2.配备的电表和天然气、新水等介质的计量器具，精度要符合《用能单位能源计量器具配备和管理通则》（GB17167-2025）要求。 3.按照《重点用能单位节能管理办法》（2018年修订）相关要求接入全省能耗在线监测系统，定期报送能源利用状况和碳排放情况报告。 （五）其他要求。 1.项目建成投产后，应认真执行国家、省节能降碳政策要求，积极开展节能降碳技术改造，并综合采取碳排放配额交易、项目碳排放等量替代等措施减少项目碳排放。 2.项目应优先选用能效碳效标准领先的产品和设备，将能效碳效指标作为重要的技术指标列入设备招标文件和采购合同，不得使用国家明令禁止和淘汰的落后工艺及设备。 3.加强能源和碳排放管理，对企业能耗、碳排放进行实时记录、监测和分析。 八、项目建设单位、建设地点、建设规模、主要生产装置、用能设备、工艺技术路线、主要产品品种及其他方面较节能报告、节能审查意见等发生重大变化的，请按照《广东省固定资产投资项目节能审查实施办法》（粤能规〔2023〕3号）第十八条规定执行。 九、请中创新航科技（江门）有限公司根据本审查意见和项目节能报告，对项目设计、施工、竣工验收以及运营管理进行有效监督检查，及时报告本审查意见落实情况和项目有关重大事项。我局按规定组织开展对节能审查意见落实情况的跟踪检查。 十、项目投入生产、使用前，请中创新航科技（江门）有限公司组织对项目节能降碳相关情况进行验收，并将验收报告报我局和江门市发展和改革局留存。未按规定进行节能审查验收或验收不合格擅自投入生产、使用的，以及以提供虚假材料等不正当手段通过节能审查验收的，责令限期整改。 十一、请江门市发展和改革局积极推进重点用能单位节能降碳改造工作，加强用能预算精细化管理，为江门市后续新增耗能项目建设腾出能耗空间。 十二、本节能审查意见自印发之日起两年内有效，项目逾期未开工建设的，应重新进行节能审查和碳排放评价。 相关附件： 相关导读: 分享到： 打印文档 关闭窗口 相关网站 广东省投资项目在线审批监管平台 信用广东网 广东省招标投标监管网 粤港澳大湾区门户网 委管局/直属单位 广东省粮食和物资储备局 广东 : "长期有效型", "status": "现行有效", "is_original": "是", "url": "https://www.ndrc.gov.cn/xxgk/zcfb/ghxwj/202506/t20250603_1398199.html", "local_paths": "01_原始资料\\官方政策\\2025-06-03_全国_国家发展改革委_【关于深化提升“获得电力”服务水平_全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号)】-国家发展和改革委员会.html; 03_处理后文本\\2025-06-03_全国_国家发展改革委_【关于深化提升“获得电力”服务水平_全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号)】-国家发展和改革委员会.txt", "text_path": "03_处理后文本\\2025-06-03_全国_国家发展改革委_【关于深化提升“获得电力”服务水平_全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号)】-国家发展和改革委员会.txt", "summary": "", "note": "关于深化提升“获得电力”服务水平 全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号)", "ingested_at": "2026-04-25", "review_status": "待人工复核", "snippet": "【关于深化提升“获得电力”服务水平 全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 规范性文件 关于深化提升“获得电力”服务水平 全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号) 发布时间：2025/06/03 来源： 国家能源局 [ 打印 ] 国家发展改革委 国家能源局关于深化提升 “获得电力”服务水平 全面打造现代化 用电营商环境的意见 ...", "text": "【关于深化提升“获得电力”服务水平 全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 规范性文件 关于深化提升“获得电力”服务水平 全面打造现代化用电营商环境的意见(发改能源规〔2025〕624号) 发布时间：2025/06/03 来源： 国家能源局 [ 打印 ] 国家发展改革委 国家能源局关于深化提升 “获得电力”服务水平 全面打造现代化 用电营商环境的意见 发改能源规〔2025〕624号 各省、自治区、直辖市、新疆生产建设兵团发展改革委、能源局，北京市城市管理委，天津、上海、重庆市经信委（工信局），国家能源局各派出机构，国家电网有限公司、中国南方电网有限责任公司、内蒙古电力（集团）有限责任公司，各有关供电企业： 推进用电营商环境建设，是打造市场化、法治化、国际化一流营商环境的重要组成部分。《国家发展改革委 国家能源局关于全面提升“获得电力”服务水平 持续优化用电营商环境的意见》（发改能源规〔2020〕1479号）实施以来，全国实现了用电报装“三零”（零上门、零审批、零投资）、“三省”（省力、省时、省钱）服务全覆盖，我国用电营商环境得到了根本性改善，人民群众用电获得感明显增强。当前，我国正迈上全面建设社会主义现代化国家新征程，为全面贯彻落实党中央、国务院关于优化营商环境决策部署，按照《中华人民共和国能源法》《优化营商环境条例》等法律法规要求，坚持以人民为中心的发展思想，持续提升“获得电力”服务水平，满足人民群众对美好生活的高品质用电需求，服务经济社会高质量发展，提出如下意见。 一、总体要求 以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，深入落实“四个革命、一个合作”能源安全新战略，坚持人民至上、系统推进、示范引领、分类施策的原则，持续深化工作机制、服务模式、监管体系改革创新，进一步巩固“三零”“三省”服务成效，强化民生用电保障，促进绿色低碳发展，全面建设具有中国特色的现代化用电营商环境，为经济社会高质量发展提供有力支撑。通过打造一批具有较强国际竞争优势的用电营商环境一流城市，建设一批具有引领示范作用的用电营商环境先进地区，发展一批具有区域影响力的用电营商环境特色城镇和乡村，带动全国城乡“获得电力”服务水平整体提升。到2029年，我国基本建成办电便捷化、供电高质化、用电绿色化、服务普惠化、监管协同化的现代化用电营商环境，我国“获得电力”国际竞争优势进一步巩固，人民群众办电用电获得感满意度持续增强。 二、持续改革创新，推进办电便捷化 （一）巩固提升“三零”服务。拓展“三零”服务对象。 全力支持民营经济发展壮大，将低压办电“零投资”扩大至160千瓦及以下各类民营经济组织，鼓励有条件的地区进一步提升低压接入容量上限。 提高“三零”服务质效。 低压用户全过程办电时间，无电力外线工程的不超过5个工作日，有电力外线工程的不超过15个工作日；涉及10千伏及以上公共电网升级改造的，供电企业应同步建设配套电网，及时保障用户用电需求，电网升级改造工期无法满足接电时限规定的，应明确工程完成时限，并报送国家能源局派出机构及地方能源（电力）主管部门备案。 创新“三零”服务模式。 对于春灌秋收、炒茶烤烟、地摊夜市等场景中的临时性、流动性用电需求，供电企业应配合地方政府做好便民接电点规划建设，通过“扫码用电”等模式为群众提供免报装、快用电服务，支持乡村振兴发展，助力激发消费活力。 （二）持续深化“三省”服务。推广主动办电服务。 供电企业通过政务平台等渠道动态获取项目用电需求，超前对接用户，主动提供政策咨询、办电指导，适度超前建设配套电网工程，及时保障用户接电需求。 推行快捷办电服务。 供电企业全面落实办电时限要求（详见附件），对于列为国家和省级重大项目的，应开辟办电绿色通道，结合实际进一步精简办电申请资料，优化办电服务流程，全力满足项目用电需求。 实施精准办电服务。 各省级能源（电力）主管部门指导供电企业明确用电报装容量标准并向社会公开，服务用户结合实际用电需求合理确定申请容量。鼓励供电企业通过与用户签订契约协议等方式提前约定接电时间，为用户提供可预期的接电服务。 （三）全面推进“高效办成一件事”。深化水电气等联合服务。 地方能源（电力）主管部门协同配合相关部门，加快推进水电气等数据共享，全面支持线上联合申请、材料一次提交、线下联合服务。 优化涉电行政审批服务。 各地按照国家有关要求，积极推进电力外线接入工程审批流程优化。逐步推行告知承诺、备案制等举措，鼓励具备条件的地区实行非禁免批。 推广高频供电业务联办服务。 供电企业应简化合并业务办理环节，对“销户+退费”等关联性强的业务实行“一次办”，持续推进不动产登记和电力过户联动办理，鼓励推行“一地受理、多地协同”的跨网办、跨省办等异地办电服务。 （四）推行全过程数智服务。提升办电便利度。 地方能源（电力）主管部门积极推动供电服务融入数字政府建设，强化电子证照数据归集共享，提高线上办电服务效率。供电企业推进办电档案数字化建设，实现办电资料一次提交、多场景共用、有效期内复用。鼓励具备条件的地区探索创新用电报装“全程网办”服务模式，实现从报装申请到装表接电用户“一次都不跑”。 提升接电便捷度。 支持供电企业积极推进数字电网建设，实现电源点智能定位、供电路径智能规划、供电方案智能生成。对于用户受电工程，供电企业可探索采用线上方式提供竣工检验服务。 提升用电满意度。 供电企业应综合运用云计算、大数据、人工智能等数字化技术，加快推进智能客服能力建设，提供24小时在线的人工智能应答，根据不同用户类型及用电特性提供差异化服务。 三、加强全程管理，促进供电高质化 （五）强化配电网规划建设。科学规划配电网布局。 地方能源（电力）主管部门组织落实配电网高质量发展相关要求，指导供电企业统筹主配网规划，适度超前做好电网设施布局，提高配电网灵活转带和自愈能力。差异化提高局部规划设计和灾害防范标准，促进防灾抗灾能力提升。 优化配电网投资管理。 供电企业合理安排配电网建设改造资金，向农村地区、民族地区、老旧小区、城中村等供电薄弱区域倾斜，结合分布式新能源、电动汽车充电设施、清洁取暖等发展需求，加快配电网改造升级，切实提升城乡配电网供电保障能力和综合承载能力。各省级电网企业应定期向当地能源（电力）主管部门、国家能源局派出机构报送下一年度配电网投资、改造计划，探索配电网投资运营模式创新，建立适应新型主体广泛参与的市场机制。 有效提升供电质量。 持续提升配电线路及台区电能质量问题分析能力和综合治理水平，进一步缩小城乡、区域供电差距。鼓励有条件的地区探索开展电能质量服务示范建设，供电企业和用户可将高电能质量服务相关内容纳入供用电合同。 加强供电可靠性管理。 推动基于实时数据的电力可靠性管理体系建设，努力实现可靠性数据由人工采集录入逐步过渡到自动收集、自主研判。持续提升供电可靠性数据质量，常态化开展供电可靠性数据质量核查。支持有条件的地区试点开展低压供电可靠性统计。 （六）提高配电网管理质效。加强配电网主动运维。 供电企业深化配电网智能巡检体系建设，加强带电检测装备应用，推广无人机巡检模式，提升设备隐患排查治理能力。完善配电网停电监控、故障研判和自愈控制策略，减少故障停电次数、停电时间和影响范围。 优化配电网检修计划。 供电企业统筹电网建设改造、设备更换检修、市政工程配合等需求，综合制定设备停电检修计划，实行“一停多用”。深化不停电作业技术应用，进一步压减计划检修停电时间，逐步实现重点城市重点区域计划检修“零感知”。 探索推进供电可靠性奖惩机制。 鼓励具备条件的城市探索建立供电可靠性管理奖惩机制，明确奖惩标准，按年度发布区域供电可靠性管理奖惩结果。 （七）常态化治理频繁停电。巩固频繁停电整治成效。 供电企业严格按照“一年内停电次数不超过5次”“连续60天停电次数不超过3次”标准（因恶劣天气等不可抗力和外力破坏造成的停电除外）进行总体管控，加快问题台区线路“整线成片”标准化治理，实现频繁停电问题动态清零。 建立治理成效监督检验机制。 供电企业通过营业厅、门户网站等渠道主动公开所属线路、台区频繁停电整治情况，接受群众监督。国家能源局派出机构建立跟踪评价、闭环销号工作机制，采取用户走访、现场检查等方式检验频繁停电治理成效。 四、服务低碳转型，践行用电绿色化 （八）支持绿色电力应用。助力绿电接入。 各省级能源（电力）主管部门牵头组织开展分布式光伏接入电网承载力评估信息公开工作，组织供电企业针对性制定提升措施，促进配电网与分布式新能源协调发展。 促进绿电消费。 供电企业建立健全宣传和推广长效服务机制，鼓励引导重点用能单位使用绿电，激发全社会绿电消费潜力。 服务绿色出行。 地方能源（电力）主管部门组织供电企业优化完善电动汽车充（换）电设施用电报装服务机制，进一步简化居民用户报装申请资料，持续提高接电服务效率。供电企业按照“三零”政策要求做好电动自行车充电设施接电服务，全力落实电动自行车安全隐患全链条整治任务，切实保障群众绿色出行需求。 （九）服务用户节能增效。拓展公共增值服务。 供电企业按照国家节能降碳有关工作部署，开展企业用户用能数据采集及数字化分析。供电企业免费提供电能监测、能效诊断、能效咨询等公共服务，加强大数据技术应用，探索采用电力行业人工智能大模型开展用户用能特性分析，提出节能建议，推动供电服务向“供电+能效”服务延伸。开展电能替代政策宣传、技术咨询，服务企业生产经营向绿色低碳转型。 加快综合能源服务市场培育。 鼓励供电企业依法依规开展社会用能信息共享，推动更多主体积极参与能效服务，深化应用“人工智能+”等数字技术手段，提高信息精准度和服务便捷性，满足用户高品质、多样化用能需求。国家能源局及其派出机构、各省级能源（电力）主管部门加强对供电企业提供用户侧能源托管、节能改造等服务行为的监管，防止供电企业及其关联企业利用行业优势垄断市场。 五、共享发展成果，推进服务普惠化 （十）提升居民供电薄弱区域保障能力。推动解决现有居民小区用电突出问题。 各地按照“依法依规、积极稳妥”原则，充分利用“两新”资金等相关支持政策，分类施策，有序推进老旧小区、城中村等供电普遍服务薄弱区域供配电设施规范化改造，进一步做好非电网直供电小区用电问题治理。 健全新建居民小区可靠供电保障机制。 各地要督促房屋工程开发建设单位在组织竣工验收时严把建筑电气分部工程验收质量关，指导供电企业加快配套电网工程建设，保障小区用电设施接入需求，共同推动正式用电设施与房屋主体工程同步验收、同步交付使用。对于符合国家、行业和地方建设标准的新建居民小区供配电设施，产权主体自愿移交的，供电企业应予接收。 （十一）加强城乡民生用电服务保障。健全民生用电保障机制。 供电企业应常态开展民生供电设施状态监测，强化迎峰度夏度冬等特殊时期、城乡居住密集区域等重点地段电网设备状态检修和事故应急抢修保障，确保可靠供电。 提升用户产权设备健康水平。 供电企业应协助开展非电网直供电小区用户产权设备隐患排查，提供必要的技术服务，配合政府部门积极推动用户及时消除设备隐患缺陷、配足用好自备应急电源。 做好民生用电保障抢修服务。 涉及民生用电的，出现因用户抢修力量不足、抢修主体缺失等情况导致群众生产生活用电难以保障时，供电企业应积极配合地方政府提供抢修服务，切实保障民生用电需求。 （十二）维护友好和谐供用电关系。推进政企网格联动服务。 坚持并发展新时代“枫桥经验”，聚合政企网格资源，政企联动开展“电力客户经理+政务网格员”联合服务，统一城乡供电服务标准、规范网格服务流程，基本形成城乡均等化供电服务体系。 推进供电服务信息精准直达终端用户。 对于办电服务进程、抢修复电进度等事项，供电企业提供基于用户视角的查询服务，提升服务体验感。鼓励有条件的地区应用大数据技术等方式完善非电网直供电终端用户基础信息，通过便民服务应用软件（APP）等数字化服务渠道，及时向终端用户推送故障抢修、安全用电等与群众生产生活密切相关的供用电服务信息。 规范供电企业电费结算服务。 供电企业应健全完善电费管理制度，严格按照国家规定为用户提供电费结算服务，未经供用电合同约定不得要求用户预付电费。依法依规实施欠费停电时，供电企业应严格按照规定履行提前告知等程序，涉及居民住宅小区的，还应提前报告地方能源（电力）主管部门。 六、强化多方联动，推进监管协同化 （十三）健全协同监管体系。压实属地监督管理责任。 各省级能源（电力）主管部门牵头组织开展深化提升“获得电力”服务水平工作，推进落实各项重点任务，指导基层能源（电力）主管部门履行属地责任，具体协调解决群众办电用电急难愁盼问题。 加强央地协同监管。 国家能源局派出机构充分发挥中央监管事权主体作用，切实履行电力领域监管职责，督促指导省级能源（电力）主管部门推动“获得电力”相关任务落实，会同地方政府相关部门推动供电服务领域的共性问题和突出问题解决，严肃查处违法违规行为。持续健全完善供电服务监管机制和执法体系，逐步形成各层级能源（电力）主管部门权责清晰、协同发力的工作体系，实现监管领域和执法队伍覆盖到位。 （十四）完善投诉处理机制。健全投诉处理工作机制。 国家能源局及其派出机构、省级能源（电力）主管部门和供电企业应完善用户投诉处理制度，研究建立投诉转办和协同联办机制。 加强供电企业投诉处理情况监管。 国家能源局及其派出机构、地方能源（电力）主管部门应通过抽查投诉事项办理情况、组织供电企业定期分析报告等方式，持续强化供电服务投诉处理情况监管力度，及时梳理研究苗头性、倾向性问题，推动共性问题有效解决。 七、组织保障 国家发展改革委、国家能源局强化顶层设计和整体协调，建立健全工作推进机制，统筹做好全国深化提升“获得电力”服务水平工作。各省级能源（电力）主管部门要继续发挥“获得电力”工作协调机制作用，会同相关部门强化任务落实，持续加大政策支持力度，指导基层政府有关主管部门合力推进。国家能源局派出机构要按照职责强化监管，及时发现问题并督促整改。各供电企业要履行主体责任，将打造现代化用电营商环境工作纳入“一把手”工程，确保相关任务举措落到实处。各单位要及时梳理总结经验，持续深化改革创新，更好地服务企业群众办电用电，以高质量的用电营商环境助力中国式现代化全面推进。 本意见自2025年7月1日起施行，有效期5年。《国家发展改革委 国家能源局关于全面提升“获得电力”服务水平 持续优化用电营商环境的意见》（发改能源规〔2020〕1479号）同时废止。 附件：供电企业办理用电报装业务时限要求 国家发展改革委 国 家 能 源 局 2025年5月16日 附件： 供电企业办理用电报装业务时限要求.pdf 供电企业办理用电报装业务时限要求.ofd 相关政策与解读 《关于深化提升“获得电力”服务水平 全面打造现代化用电营商环境的意见》政策解读 排行榜", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260425-921C75C18D", "title": "关于我市开展气电价格联动调整有关事项的通知_价格管理", "department": "上海市发展和改革委员会", "collection_source": "上海市发展和改革委员会", "publish_date": "2026-04-24", "document_number": "沪发改价管〔2026〕19号", "regions": ["上海"], "provinces": ["上海"], "source_type": "官方政策", "policy_level": "", "topics": ["电力市场"], "keywords": ["电价"], "authority": "A", "time_sensitivity": "长期有效型", "status": "现行有效", "is_original": "是", "url": "http://fgw.sh.gov.cn/fgw_jggl/20260424/62667a4bb7c44726a46cbe4c60c38c55.html", "local_paths": "01_原始资料\\官方政策\\2026-04-24_上海_上海市发展和改革委员会_关于我市开展气电价格联动调整有关事项的通知_价格管理.html; 03_处理后文本\\2026-04-24_上海_上海市发展和改革委员会_关于我市开展气电价格联动调整有关事项的通知_价格管理.txt", "text_path": "03_处理后文本\\2026-04-24_上海_上海市发展和改革委员会_关于我市开展气电价格联动调整有关事项的通知_价格管理.txt", "summary": "", "note": "关于我市开展气电价格联动调整有关事项的通知", "ingested_at": "2026-04-25", "review_status": "待人工复核", "snippet": "关于我市开展气电价格联动调整有关事项的通知_价格管理 政务公开 当前位置： 首页 / 政务公开 / 决策公开 国统一电力市场评价制度的通知(发改办体改〔2025〕1032号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 通知 关于建立全国统一电力市场评价制度的通知(发改办体改〔2025〕1032号) 发布时间：2025/12/17 来源： 体改司 [ 打印 ] 国家发展改革委办公厅 国家能源局综合司关于 建立全国统一电力市场评价制度的通知 发改办体改〔2025〕1032号 各省、自治区、直辖市、新疆生产建设兵团发展改革...", "text": "【关于建立全国统一电力市场评价制度的通知(发改办体改〔2025〕1032号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 通知 关于建立全国统一电力市场评价制度的通知(发改办体改〔2025〕1032号) 发布时间：2025/12/17 来源： 体改司 [ 打印 ] 国家发展改革委办公厅 国家能源局综合司关于 建立全国统一电力市场评价制度的通知 发改办体改〔2025〕1032号 各省、自治区、直辖市、新疆生产建设兵团发展改革委、能源局，天津市工业和信息化局、内蒙古自治区工业和信息化厅、辽宁省工业和信息化厅、广西壮族自治区工业和信息化厅、重庆市经济和信息化委员会、四川省经济和信息化厅、甘肃省工业和信息化厅，北京市城市管理委员会，国家能源局各派出机构，国家电网有限公司、中国南方电网有限责任公司、内蒙古电力（集团）有限责任公司，北京电力交易中心、广州电力交易中心，电力规划设计总院、水电水利规划设计总院，中国电力企业联合会： 为深入贯彻落实党中央、国务院关于加快建设全国统一大市场、深化电力体制改革的决策部署，保障全国统一电力市场体系高效运行和有效监管，现就建立全国统一电力市场评价制度有关事项通知如下。 一、总体要求 以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，按照完善全国统一电力市场体系要求，围绕加快构建新型电力系统的总体目标，构建科学、系统、动态的电力市场评价体系，统筹安全保供、绿色转型、经济效率等多重目标，全面准确评价电力市场运行成效，为电力市场建设和监管提供决策依据，促进监管工作科学化、精准化，进一步发挥全国统一电力市场在电力资源优化配置中的决定性作用。 二、评价内容 全国统一电力市场评价工作应结合市场建设情况开展多维度综合评价，重点围绕电力市场运营效果、市场作用发挥、经营主体可持续性发展、市场竞争充分度四个方面开展评价。 （一）市场运营效果评价 1.市场建设进展。形成完整的统一电力市场基础规则体系，各地方能够及时出台实施细则或方案，在全国范围实现中长期、现货、辅助服务等各类市场的基本全覆盖。 2.技术标准。具有完整的电力市场技术标准体系，同市场政策规则有序衔接，满足电力市场建设现阶段需要和行业发展需求，反映当前电力市场的先进技术和应用实践。 3.市场运营。电力市场运营基础构建情况，市场成员管理和注册业务便捷高效；市场信息披露及时、准确、完整，市场交易组织规范，电力市场计量结算及时准确，市场干预机制执行合理，市场衔接顺畅；电力市场技术支持系统满足统一电力市场建设的要求，系统功能完备、建设规范、安全可靠等情况。 4.市场共治。电力市场管理委员会能够切实发挥研究市场规则、协调市场事项、反映各方诉求、开展自律监督、协助市场监管等作用，保障电力市场的公平公正、平稳有序。 5.监管效果。建立统一电力市场监管体系，监管标准全国统一，监管手段科学完备，能够运用数字化等方式提升监管效能。 （二）市场作用发挥评价 6.要素流通。促进电力要素在全国范围高效流通，跨省跨区电力交易频率、交易规模持续增长，增强电网整体运行效率。跨经营区交易常态化开市，有效落实西电东送等国家能源战略，发挥省间余缺互济作用。 7.安全效益。通过电能量、辅助服务市场及容量补偿机制的协同运作，保障电力连续可靠供应和电网安全稳定运行。电能量市场对各类电源的顶峰保供激励作用，辅助服务市场挖掘发用两侧调节潜力，对电网安全稳定运行作用；容量电价对支撑性电源、调节性资源的投资进行合理引导。 8.环境效益。市场机制和政策促进新能源高质量发展和消纳，推动绿电交易规模扩大和绿证市场发展，实现绿色环境价值，新能源利用率保持合理水平，提升度电碳减排效益，支持国家“双碳”目标实施。 9.经济效益。测算电力市场整体经济效益变动情况，市场通过供需动态定价，有效引导资源跨时空优化配置，维持电价在合理区间内波动，保障发电成本合理回收，提升系统整体经济性与投资回报预期。 （三）经营主体可持续发展评价 10.经营状况。市场机制引导投资合理布局，保障电力企业成本回收和稳健经营，增强行业可持续发展能力，维持产业平稳运行。 11.主体培育。市场为储能、虚拟电厂等新业态提供发展空间，推动民营企业参与，带动相关产业链成长，促进就业和能源新质生产力提升。 12.市场满意度。经营主体对电力市场的基本环境、总体效果评价积极，参与意识和参与度不断提高，市场认同感增强。 （四）市场竞争充分度评价 13.主体行为。电力市场实现统一开放，经营主体有序竞争，对不当市场竞争、报价异常及市场力滥用行为能够有效约束，电力市场信用机制健全，能够对市场失信行为进行惩戒。 14.市场集中度。电力市场集中度指数处于合理区间，供需平衡风险与价格波动风险实现动态监测与阈值管控，市场风险防控机制健全有效。 三、评价方法 （一）构建评价指标体系和标准体系 综合考虑电力市场运营实际，评价指标的实用性、易获得性以及代表性等，逐步建立电力市场评价指标体系，完整、准确、全面反映市场多维评价内容，并适时动态调整和完善。建立电力市场评价标准体系，制定电力市场评价标准规范，规范化开展评价工作。 （二）采用多维综合分析方法 1.定性与定量相结合。定性分析主要通过现场调查、专家访谈、经营主体座谈、问卷调查等方式联合开展；定量评价主要基于评价指标开展量化分析，具体指标体系另行制定。 2.横向与纵向对比相结合。横向对比是不同评价对象之间的对比分析；纵向对比是对同一评价对象不同时间周期的变化趋势分析。 3.过程和效果评价相结合。过程评价聚焦市场规则设计、执行与动态运行情况；效果评价主要衡量市场资源配置效率、社会福利分配及政策目标达成度等。 （三）发挥数字化技术支撑 充分发挥数字化技术对电力市场评价的支撑作用，强化电力市场评价与数字化监管的工作协同。实现电力市场数字化监管对市场运行状态实时监测，及时发现异常波动、潜在风险和市场效率问题，提升评价的时效性和响应速度。推进市场评价智能化，逐步推动将市场评价由“描述性”升级为“预测性”，实现市场评价可观、可测、可感，为主动防控市场风险、优化市场规则、保障系统安全稳定运行提供关键支撑。 （四）按需有序开展评价 自2026年起组织开展全国统一电力市场评价，制定市场评价标准。鼓励各地因地制宜按需开展电力市场评价工作。鼓励市场运营机构充分发挥自身优势，开展市场量化评价，及时发现并反馈电力市场建设运营相关问题。 （ 五）加强评价结果应用 电力市场评价工作应形成评价报告，供相关政府部门及电力市场运营机构参考。国家能源局派出机构、地方能源主管部门、电力市场运营机构要认真做好市场评价结果应用，加强分析研判和整改提升。 四、做好组织落实 全国统一电力市场评价工作由国家发展改革委、国家能源局统筹组织，市场运营机构、高校、科研院所等单位共同参与。省级发展改革、能源等部门在省级人民政府领导下，要切实担负主体责任，与国家能源局派出机构、市场运营机构等加强工作协同，形成工作合力，共同开展电力市场评价，持续做好市场建设和监管工作。组织及参与电力市场评价的有关单位要切实履行评价工作职责，按照相关法律法规要求独立、专业、全面开展电力市场评价，形成公正客观的评价结果。国家能源局派出机构可根据监管需要，组织第三方机构对电力市场运营机构进行电力市场业务专业监管评估。各有关单位要保障电力市场评价工作安全稳定，提高工作效率，减轻地方和企业负担，避免无效评价、重复评价、多头评价。 国家发展改革委办公厅 国家能源局综合司 2025年12月2日 附件： 相关政策与解读 排行榜", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260425-B3B8DDADB6", "title": "【关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号)】-国家发展和改革委员会", "department": "国家发展改革委", "collection_source": "国家发展改革委-政策通知", "publish_date": "2026-01-30", "document_number": "发改价格〔2026〕114号", "regions": ["全国"], "provinces": ["全国"], "source_type": "官方政策", "policy_level": "国家级", "topics": ["容量电价"], "keywords": ["容量电价", "电价"], "authority": "A", "time_sensitivity": "长期有效型", "status": "现行有效", "is_original": "是", "url": "https://www.ndrc.gov.cn/xxgk/zcfb/tz/202601/t20260130_1403524.html", "local_paths": "01_原始资料\\官方政策\\2026-01-30_全国_国家发展改革委_【关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号)】-国家发展和改革委员会.html; 03_处理后文本\\2026-01-30_全国_国家发展改革委_【关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号)】-国家发展和改革委员会.txt", "text_path": "03_处理后文本\\2026-01-30_全国_国家发展改革委_【关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号)】-国家发展和改革委员会.txt", "summary": "", "note": "关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号)", "ingested_at": "2026-04-25", "review_status": "待人工复核", "snippet": "【关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 通知 关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号) 发布时间：2026/01/30 来源： 价格司 [ 打印 ] 国家发展改革委 国家能源局关于 完善发电侧容量电价机制的通知 发改价格〔2026〕114号 各省、自治区、直辖市及新疆生产建设兵团发展改革委、能源局，天津市工业和信息化局、辽宁省工...", "text": "【关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 通知 关于完善发电侧容量电价机制的通知(发改价格〔2026〕114号) 发布时间：2026/01/30 来源： 价格司 [ 打印 ] 国家发展改革委 国家能源局关于 完善发电侧容量电价机制的通知 发改价格〔2026〕114号 各省、自治区、直辖市及新疆生产建设兵团发展改革委、能源局，天津市工业和信息化局、辽宁省工业和信息化厅、重庆市经济和信息化委员会、甘肃省工业和信息化厅、北京市城市管理委员会，国家能源局各派出机构，国家电网有限公司、中国南方电网有限责任公司、内蒙古电力（集团）有限责任公司、中国核工业集团有限公司、中国华能集团有限公司、中国大唐集团有限公司、中国华电集团有限公司、国家电力投资集团有限公司、中国长江三峡集团有限公司、国家能源投资集团有限责任公司、国家开发投资集团有限公司、华润（集团）有限公司、中国广核集团有限公司： 为贯彻落实党中央和国务院关于推进能源领域价格改革，加快建设新型能源体系的决策部署，引导调节性电源平稳有序建设，保障电力系统安全稳定运行，助力经济社会绿色发展，现就完善发电侧容量电价机制有关工作通知如下。 一、总体思路 适应新型电力系统和电力市场体系建设需要，更好统筹电力安全稳定供应、能源绿色低碳转型和资源经济高效配置，分类完善煤电、天然气发电、抽水蓄能、新型储能容量电价机制，优化电力市场机制；电力现货市场连续运行后，有序建立发电侧可靠容量补偿机制，对机组可靠容量根据顶峰能力按统一原则进行补偿，公平反映不同机组对电力系统顶峰贡献。 二、分类完善容量电价机制 （一）完善煤电及天然气发电容量电价机制。 各地按照《关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号）要求，将通过容量电价回收煤电机组固定成本的比例提升至不低于50%，可结合当地市场建设、煤电利用小时数等实际情况进一步提高。 省级价格主管部门可对天然气发电建立容量电价机制，容量电价按照回收天然气发电机组一定比例固定成本的方式确定。 （二）完善抽水蓄能容量电价机制。 《关于进一步完善抽水蓄能价格形成机制的意见》（发改价格〔2021〕633号，简称633号文件）出台前开工（取得取水、临时用地、环评批复文件，下同）建设的电站，容量电价继续实行政府定价，具体由省级价格主管部门按照633号文件办法核定或校核。电站经营期满后，按照弥补必要技术改造支出和运行维护成本的原则重新核价。 按照633号文件明确的逐步实现主要通过参与市场回收成本、获得收益的精神，该文件出台后开工建设的电站，由省级价格主管部门每3—5年按经营期内弥补平均成本的原则，根据633号文件明确的成本参数规则，制定省级电网同期新开工电站统一的容量电价（满功率发电时长低于6小时的相应折减）。执行年限可统筹考虑电力市场建设发展、电力系统需求、电站可持续发展等情况确定。同时，抽水蓄能电站自主参与电能量、辅助服务等市场，获得的市场收益按比例由电站分享，分享比例由省级价格主管部门确定；其余部分冲减系统运行费用、由用户分享。 （三）建立电网侧独立新型储能容量电价机制。 对服务于电力系统安全运行、未参与配储的电网侧独立新型储能电站，各地可给予容量电价。容量电价水平以当地煤电容量电价标准为基础，根据顶峰能力按一定比例折算（折算比例为满功率连续放电时长除以全年最长净负荷高峰持续时长，最高不超过1），并考虑电力市场建设进展、电力系统需求等因素确定。电网侧独立新型储能电站实行清单制管理，管理要求由国家能源局根据电力供需形势分析及保供举措等另行明确，项目具体清单由省级能源主管部门会同价格主管部门制定。 三、有序建立发电侧可靠容量补偿机制 （一）可靠容量补偿机制的总体要求。 可靠容量是指机组在全年系统顶峰时段能够持续稳定供电的容量。电力现货市场连续运行后，省级价格主管部门会同相关部门适时建立可靠容量补偿机制，对机组可靠容量按统一原则进行补偿。补偿标准以弥补市场边际机组在电能量和辅助服务市场不能回收的固定成本为基础，统筹考虑电力供需关系、用户承受能力、电力市场建设进展等因素合理确定，并适时调整。新能源装机占比高、可靠容量需求大的地区，应加快建立可靠容量补偿机制。在国家指导下，具备条件的地区可结合电力市场建设情况适时通过容量市场等方式形成容量电价。 （二）合理确定补偿范围。 可靠容量补偿机制的补偿范围，可包括自主参与当地市场的煤电、气电和符合条件的电网侧独立新型储能等，并结合电力市场建设和电价市场化改革等情况逐步扩展至抽水蓄能等其他具备可靠容量的机组；对获得其他保障的容量不重复补偿。政府定价的机组，不予补偿。 （三）做好与容量电价政策的衔接。 可靠容量补偿机制建立后，相关煤电、气电、电网侧独立新型储能等机组，不再执行原有容量电价。省级价格主管部门可在市场体系较为健全的基础上，对本通知出台后开工建设的抽水蓄能电站，统一执行可靠容量补偿机制并参与电能量和辅助服务等市场、市场收益全部由电站获得。鼓励633号文件出台后开工建设的抽水蓄能电站自主选择执行可靠容量补偿机制并参与电力市场。 四、完善相关配套政策 （一）完善电力市场交易和价格机制。 煤电容量电价机制完善后，各地可根据电力市场供需、参与市场的所有机组变动成本等情况，适当调整省内煤电中长期市场交易价格下限，在确保电力电量平衡的情况下适当放宽煤电中长期合同签约比例要求。鼓励供需双方在中长期合同中签订随市场供需、发电成本变化的灵活价格机制。省内市场供需双方签订中长期合同时，各地不得强制要求签订固定价，可根据电力供需、市场结构等情况，要求年度中长期合同中约定一定比例电量实行反映实时供需的灵活价格。 （二）完善电费结算政策。 上述调节性电源的容量电费、可靠容量补偿费用，纳入当地系统运行费用。现货市场连续运行地区，抽水蓄能抽发、电网侧独立新型储能充放电价按市场规则或现货实时价格执行；现货市场未连续运行地区，抽水（充电）价格执行电网代理工商业用户购电价格，发电（放电）价格形成方式由省级价格主管部门统筹考虑各类技术路线充放损耗等确定。抽水蓄能、电网侧独立新型储能抽水（充电）时视作用户，缴纳上网环节线损费用和系统运行费用，暂按单一电量制用户执行输配电价；发电（放电）电量相应退减输配电费。按比例由抽水蓄能电站分享的市场收益，统一按月结算、按年清算。 （三）明确区域共用抽水蓄能容量电费分摊方式。 区域共用抽水蓄能电站的容量电费分摊比例根据容量分配比例确定，鼓励通过市场化方式优化。其中，容量分配比例已经明确的，按已明确比例执行；容量分配比例尚未明确但项目已核准的，由所在地省级能源、价格主管部门组织拟参与分摊省份能源、价格主管部门协商确定并明确；尚未核准的新建项目，按上述原则协商确定后在项目核准文件中予以明确。 五、做好组织实施 （一）加强工作协同。 省级价格主管部门要会同相关部门完善容量电价政策和适时建立可靠容量补偿机制，周密组织实施，做好政策解读，引导企业加强经营管理，促进行业健康发展。省级能源主管部门要会同价格主管部门科学测算当地电力系统可靠容量需求。各地要加快建立健全电力市场体系，实现抽水蓄能、新型储能等机组公平参与电能量、辅助服务等各类市场，更好体现调节价值，促进调节作用充分发挥。电网企业要配合开展数据测算，与电站签订调度运行协议和有关合同，做好市场收益计算、结算等工作，有关情况每年报省级价格主管部门和国家发展改革委（价格司）。国家将加强对各地的指导，促进平稳实施。 （二）建立电价承受能力评估制度。 省级价格主管部门要会同能源主管部门建立用户经济承受能力评估制度，将评估结果作为确定可靠容量补偿标准，制定电力系统调节能力及新能源和新型储能发展规划、方案等，核准抽水蓄能等项目的重要依据。电力系统可靠容量充裕或用户经济承受能力较弱的地区，要从严控制新增调节性电源项目；未开展用户经济承受能力评估的相关项目，不得纳入规划及核准，不得给予容量电费或可靠容量补偿。 （三）加强容量电费考核。 结合对各类机组管理要求完善容量电费考核办法，分类进行考核，引导机组提升生产运行水平，增强顶峰出力能力。可靠容量补偿机制建立后，进一步从严加强考核， ested_at": "2026-04-25", "review_status": "待人工复核", "snippet": "【关于优化集中式新能源发电企业市场报价的通知(试行)(发改能源〔2025〕1476号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 通知 关于优化集中式新能源发电企业市场报价的通知(试行)(发改能源〔2025〕1476号) 发布时间：2025/12/11 来源： 能源局 [ 打印 ] 国家发展改革委 国家能源局关于优化集中式 新能源发电企业市场报价的通知（试行） 发改能源〔2025〕1476号 各省、自治区、直辖市及新疆生...", "text": "【关于优化集中式新能源发电企业市场报价的通知(试行)(发改能源〔2025〕1476号)】-国家发展和改革委员会 首页 > 政务公开 > 政策 > 通知 关于优化集中式新能源发电企业市场报价的通知(试行)(发改能源〔2025〕1476号) 发布时间：2025/12/11 来源： 能源局 [ 打印 ] 国家发展改革委 国家能源局关于优化集中式 新能源发电企业市场报价的通知（试行） 发改能源〔2025〕1476号 各省、自治区、直辖市及新疆生产建设兵团发展改革委、能源局，北京市城市管理委员会，天津市、辽宁省、甘肃省工业和信息化局（厅）、重庆市经济和信息化委员会，国家能源局各派出机构，中国核工业集团有限公司、国家电网有限公司、中国南方电网有限责任公司、中国华能集团有限公司、中国大唐集团有限公司、中国华电集团有限公司、国家电力投资集团有限公司、中国长江三峡集团有限公司、国家能源投资集团有限责任公司、华润（集团）有限公司、中国广核集团有限公司、内蒙古电力（集团）有限责任公司，北京电力交易中心、广州电力交易中心： 为深入贯彻落实党中央、国务院关于深化电力体制改革和经济社会绿色低碳转型的决策部署，更好落实新能源全面入市交易要求，推动构建符合新能源发电特性、分布格局、经营现状的市场报价方式，规范电力市场运行秩序，提升电力资源优化配置效率，助力新型电力系统建设和双碳目标实现，现将有关事项通知如下。 一、基本原则 （一）本通知所称集中报价，特指多个已完成市场注册的集中式新能源发电企业（不含分布式、“沙戈荒”大基地等新能源），在同一固定场所参与电能量市场交易中的集中报价行为。新能源发电企业集中报价主要适用于电力现货市场正式运行和连续结算试运行地区电力中长期电能量交易中的集中交易和现货电能量交易。 （二）参与集中报价的新能源发电企业，原则上集中后的总装机规模不应超过所在省（区、市）电力市场单个最大燃煤发电厂装机规模（不含特高压输电通道配套电源）。原则上仅允许同一集团（同一母公司、同一控股股东、同一实际控制人等）内同一省（区、市）的新能源发电企业进行集中报价，禁止跨集团、跨省（区、市）集中报价。禁止具有竞争关系的经营者达成固定或变更商品关系的垄断协议。 （三）集中报价工作采取申请公示备案管理，新能源发电企业参与集中报价，不改变其独立市场地位、调度管理关系、交易结算关系等。 （四）经国家能源局派出机构、地方能源主管部门等相关部门认定，可能对市场公平竞争产生影响或其他不适合开展集中报价的，不得集中报价。新能源发电企业进行集中报价，不得影响电力系统安全稳定运行。 二、明确工作流程 （五）新能源发电企业申请参与集中报价，应共同向电力交易机构提交书面申请，申请信息应包括项目名称、规模、报价场所、公平竞争承诺书、所属集团证明材料等。电力交易机构5个工作日内对申请进行审核，公示5个工作日，向市场成员披露后，在交易平台建立集中报价关联关系，并将公示无异议的集中报价以书面形式报国家能源局派出机构和地方能源主管部门等相关部门备案。 （六）参与集中报价的新能源发电企业装机规模、报价场所等发生较大变化时，有关主体应在3个工作日内向电力交易机构提出变更申请，或重新申请集中报价，电力交易机构受理通过后，5个工作日内向经营主体披露。 （七）新能源发电企业申请退出集中报价，应向电力交易机构提出书面申请。其中，单一主体申请退出集中报价的，电力交易机构受理审核通过后，剩余新能源发电企业的集中报价关联关系保持不变。所有主体申请退出集中报价的，电力交易机构受理通过后取消对应关联关系。 （八）电力交易机构负责受理集中报价有关申请，并建立集中报价动态管理清单，在完成审核、公示、披露等程序后，将相关主体纳入集中报价动态管理清单，并推送电力调度机构。未履行申请等程序的新能源发电企业，不得进行集中报价。 （九）申请集中报价的新能源发电企业，除项目业主更换、破产清算、场站退役以及经国家能源局派出机构、地方能源主管部门等相关部门认定的原因外，原则上3个月内只能申请退出1次。 三、规范报价行为 （十）各经营主体原则上仍以注册主体进行报价。参与集中报价的新能源发电企业及所在固定场所，应在人员、资产和财务等方面严格与本集团其他发售电业务相隔离。 （十一）参与集中报价的新能源发电企业之间，应合法合规明确各自权责义务，并对集中报价相关行为负责。因集中报价产生的纠纷或争议，由各方自行协商或通过法律途径解决。 （十二）参与集中报价的新能源发电企业退出集中报价后，仍须对退出前已参与的集中报价行为负责。若因自身原因变更不及时造成不良后果的，或退出前已参与的集中报价存在违规行为的，国家能源局派出机构、地方相关部门可进行追溯处理。 四、做好风险防控及监管 （十三）电力市场管理委员会应充分发挥市场自律和社会监督作用，强化新能源发电企业集中报价自律管理。电力交易机构应健全新能源集中报价监测和风险防控机制，基于辖区电源结构、机制电量规模、新能源边际机组分布等情况，合理制定集中报价价格预警区间，拟订管控措施，经电力市场管理委员会审议后，由国家能源局派出机构会同地方相关部门批复后实施。 （十四）电力交易机构会同电力调度机构根据市场运行情况，结合历史数据与管控需求，合理设定价格预警区间触发条件，并依据价格预警区间触发情况，执行风险防控措施，定期向国家能源局派出机构、地方相关部门报送市场监控分析报告。 （十五）参与集中报价的新能源发电企业应按年度向政府相关部门、电力交易机构提交报价行为分析报告，报告内容应包括年度申报价格和电量情况、出清价格和电量情况、市场收益情况等内容。 （十六）新能源发电企业利用集中报价违规扰乱市场秩序、破坏市场公平竞争的，由国家能源局派出机构、地方相关部门依法依规予以处理，并强制取消集中报价关联关系，整改完成前不得再次申请集中报价。 （十七）国家能源局派出机构会同地方相关部门等单位，共同对新能源发电企业集中报价行为进行监管。国家能源局派出机构加快完善电力市场数字化监管指标体系，将集中报价行为纳入数字化监管范围。鼓励有条件的地区探索开展集中报价第三方评估，根据评估情况和赫芬达尔-赫希曼指数（HHI）、前m名份额指数（Top-m）、发电集团剩余供应率指数（RSI）等监测指标，及时优化调整相关机制举措。 五、加强工作组织 （十八）国家能源局派出机构、地方能源主管部门要加强组织领导和统筹协调，建立相关工作机制，共同制定具体实施方案，实施方案报国家能源局备案；强化新能源集中报价行为监管，加强沟通协调，及时指导电力交易机构规范有关程序，确保稳妥有序。电网企业、调度机构、交易机构等单位要压实主体责任，加强工作协同，密切监测评估试行情况，及时优化完善相关措施，有效防范各类发电企业滥用市场力。工作中遇到的重大问题，各单位要及时向国家能源局报告。 本通知自印发之日起实施，有效期三年。国家发展改革委、国家能源局将根据新能源发展等情况，适时修订调整本通知相关内容。 国家发展改革委 国 家 能 源 局 2025年11月18日 附件： 相关政策与解读 国家能源局有关负责同志就《关于优化集中式新能源发电企业市场报价的通知（试行）》答记者问 排行榜", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260425-19A93F32F1", "title": "云南电力市场规则", "department": "广州电力交易中心", "collection_source": "广州电力交易中心", "publish_date": "2024-12-09", "document_number": "", "regions": ["南方区域"], "provinces": ["云南"], "source_type": "交易规则", "policy_level": "", "topics": ["电力市场"], "keywords": ["电力市场"], "authority": "B", "time_sensitivity": "中期参考型", "status": "现行有效", "is_original": "是", "url": "https://www.gzpec.cn/law/jygz/202502/t20250214_34021.html", "local_paths": "01_原始资料\\交易规则\\2024-12-09_南方区域_广州电力交易中心_广州电力交易中心.html; 03_处理后文本\\2024-12-09_南方区域_广州电力交易中心_广州电力交易中心.txt", "text_path": "03_处理后文本\\2024-12-09_南方区域_广州电力交易中心_广州电力交易中心.txt", "summary": "", "note": "云南电力市场规则", "ingested_a 设条件。 1.申报项目应严格执行国家及本市有关投资管理各种规定，并履行项目核准（备案）手续。已开工项目应履行前期手续，独立选址的综合能源站应取得施工许可证；未开工项目应出具书面承诺函，附开工前各项手续完成时间表、审批部门、具体责任人。 2.申报项目应于2026年5月前开工并形成实物工作量。 3.项目已完工、试运行、投资完成率超过80%的项目不予以支持。 （三）落实资金来源。项目资金拼盘应完整闭合，项目各渠道资金相加应等于总投资，且资金结构相对合理。 （四）防范违规申报。申报项目符合本市固定资产投资支持范围和资金投向。项目主体应出具书面承诺函明确未享受其他市级补贴。无严重失信记录，经营状况良好，财务制度健全。各区发展改革部门应加强与相关部门沟通衔接，做好审核，原则上已经获得其他市级资金支持的项目不得多头申报，纳入严重失信单位和安全生产严重失信主体名单的单位不得申报项目。 （五）确保信息准确。资金申请文件中的项目代码、项目名称、主要建设内容、项目总投资等与项目核准（备案）等文件保持一致，确保在北京市投资项目调度与服务平台填报的各项目信息与报送文件的有关信息保持一致。 三、组织实施 （一）申报时间。2026年3月20日前。 （二）申报材料。有效的规划和用地意见、项目立项文件、项目建设方案、资金申请报告方案（达可行性研究报告深度）、《申报项目信息表》（见附件1）。 （三）报送方式。申报单位将纸质版材料（一式三份，封面加盖单位公章及骑缝章）和电子版材料统一报送至属地发展改革委（见附件2）。 （四）评估审核。由属地发展改革委对申请项目进行初审并指导项目单位完成北京市投资项目调度与服务平台录入工作。3月21日前将初审符合要求的项目报市发展改革委，市发展改革委将组织第三方开展预审，确定拟给予市政府固定资产投资支持项目清单。 （五）网上公示。符合要求的项目通过市发展改革委网站进行公示，公示时间5个工作日。 （六）资金申请及拨付。公示无异议后，市发展改革委组织相关区发展改革部门及相关项目申报单位报送资金申请报告（报告中应明确项目技术方案、系统供回水温度、系统COP、系统土壤温度冷热平衡、节能量等指标）。 市发展改革委按照《北京市政府投资管理办法》要求，开展项目评估审核及资金拨付等相关工作。凡在项目申报过程中有违纪违法行为的，一律不予受理评审。 特此通知。 附件：1.申报项目信息表 2.各区发展改革委联系方式 北京市发展和改革委员会 2026年3月6日 （联系人：李老师；联系电话：55590470） 我在听，请说话 (10s) 抱歉，没听清，请再说一遍吧 国家及各省市发展改革委 国家发展和改革委员会 天津市发展和改革委员会 河北省发展和改革委员会 山西省发展和改革委员会 内蒙古自治区发展和改革委员会 辽宁省发展和改革委员会 吉林省发展和改革委员会 黑龙江省发展和改革委员会 上海市发展和改革委员会 江苏省发展和改革委员会 浙江省发展和改革委员会 安徽省发展和改革委员会 福建省发展和改革委员会 江西省发展和改革委员会 山东省发展和改革委员会 河南省发展和改革委员会 湖北省发展和改革委员会 湖南省发展和改革委员会 广东省发展和改革委员会 广西壮族自治区发展和改革委员会 海南省发展和改革委员会 重庆市发展和改革委员会 四川省发展和改革委员会 贵州省发展和改革委员会 云南省发展和改革委员会 西藏自治区发展和改革委员会 陕西省发展和改革委员会 甘肃省发展和改革委员会 青海省发展和改革委员会 宁夏回族自治区发展和改革委员会 新疆维吾尔自治区发展和改革委员会 宁波市发展和改革委员会 大连市发展和改革委员会 深圳市发展和改革委员会 厦门市发展和改革委员会 哈尔滨市发展和改革委员会 青岛市发展和改革委员会 沈阳市发展和改革委员会 西安市发展和改革委员会 武汉市发展和改革委员会 广州市发展和改革委员会 成都市发展和改革委员会 南京市发展和改革委员会 长春市发展和改革委员会 杭州市发展和改革委员会 济南市发展和改革委员会 北京市政府机构 市政府办公厅 市教委 市科委、中关村管委会 市经济和信息化局 市民族宗教委 市公安局 市民政局 市司法局 市财政局 市人力资源社会保障局 市规划自然资源委 市生态环境局 市住房城乡建设委 市城市管理委 市交通委 市水务局 市农业农村局 市商务局 市文化和旅游局 市卫生健康委 市退役军人局 市应急局 市市场监管局 市审计局 市政府外办 市国资委 市广电局 市文物局 市体育局 市统计局 市园林绿化局 市政务和数据局 市机关事务局 市国动办 市信访办 市知识产权局 市医保局 市政府参事室 天安门地区管委会 重点站区管委会 北京经开区管委会 城市副中心管委会 市城管执法局 市监狱局 市粮食和储备局 市中医药局 市药监局 市重大项目办 市文化市场执 内各有关部门、单位积极稳妥推进电力现货市场由试运行转入正式运行，并委托电力规划设计总院开展了转正式运行第三方评估。评估意见认为,山东电力现货市场规则体系健全、合规，市场风险防控、信息披露、信用管理等制度完善，技术支持系统、人员、场所等配套保障完备，满足转正式运行条件。 经综合评估并向省政府报告，报国家发展改革委、国家能源局备案，决定自即日起，山东电力现货市场转入正式运行。 特此通知。 国家能源局山东监管办公室 山东省发展和改革委员会 山东省能源局 2024年6月17日 扫一扫在手机打开当前页 网站地图 联系我们 地址: 济南市市中区七里山路55号 邮编:250002 主办单位: 国家能源局山东监管办公室 京公网安备 11010202007691 网站标识码: bm62000012号 京ICP备11044902号 国家能源局山东监管办公室版权所有，如需转载，请注明来源", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260426-CAE77C6F94", "title": "关于印发《山东电力市场参数（试行）》的通知_国家能源局山东监管办公室", "department": "国家能源局派出机构", "collection_source": "国家能源局山东监管办公室", "publish_date": "2024-05-31", "document_number": "鲁监能市场规〔2024〕30号", "regions": ["山东"], "provinces": ["山东"], "source_type": "监管规则", "policy_level": "国家级", "topics": ["电力市场"], "keywords": ["电力市场"], "authority": "B", "time_sensitivity": "中期参考型", "status": "试行", "is_original": "是", "url": "https://sdb.nea.gov.cn/dtyw/tzgg/202405/t20240531_263857.html", "local_paths": "01_原始资料\\官方政策\\2024-05-31_山东_国家能源局派出机构_关于印发《山东电力市场参数（试行）》的通知_国家能源局山东监管办公室.html; 03_处理后文本\\2024-05-31_山东_国家能源局派出机构_关于印发《山东电力市场参数（试行）》的通知_国家能源局山东监管办公室.txt", "text_path": "03_处理后文本\\2024-05-31_山东_国家能源局派出机构_关于印发《山东电力市场参数（试行）》的通知_国家能源局山东监管办公室.txt", "summary": "", "note": "关于印发《山东电力市场参数（试行）》的通知 2024-05-31", "ingested_at": "2026-04-26", "review_status": "待人工复核", "snippet": "关于印发《山东电力市场参数（试行）》的通知_国家能源局山东监管办公室 设为首页 工作邮箱 搜索 首页 机构概览 动态要闻 信息公开 在线办事 互动回应 专题专栏 关于印发《山东电力市场参数（试行）》的通知 2024-05-31 14:47 来源：国家能源局山东监管办公室 Aa 字体： 小 | 中 | 大 关于印发《山东电力市场参数（试行）》的通知 鲁监能市场规〔2024〕30号 国网山东省电力公司，山东电力交易中心，华能山东发电公司、华...", "text": "关于印发《山东电力市场参数（试行）》的通知_国家能源局山东监管办公室 设为首页 工作邮箱 搜索 首页 机构概览 动态要闻 信息公开 在线办事 互动回应 专题专栏 关于印发《山东电力市场参数（试行）》的通知 2024-05-31 14:47 来源：国家能源局山东监管办公室 Aa 字体： 小 | 中 | 大 关于印发《山东电力市场参数（试行）》的通知 鲁监能市场规〔2024〕30号 国网山东省电力公司，山东电力交易中心，华能山东发电公司、华电集团山东分公司、国家能源集团山东公司、大唐山东发电公司、国家电投山东公司、华润电力华北大区、山东核电有限公司，各有关经营主体： 按照《国家发展改革委 国家能源局关于加快建设全国统一电力市场体系的指导意见》（发改体改〔2022〕118号）、《国家发展改革委 国家能源局关于印发<电力现货市场基本规则（试行）>的通知》（发改能源规〔2023〕1217号）等文件要求，根据《关于印发<山东电力市场规则（试行）>的通知》（鲁监能市场规〔2024〕24号）规定，山东能源监管办会同省发展改革委、省能源局组织市场运营机构、电网企业和相关经营主体编制修订了《山东电力市场参数（试行）》，现予以印发。 一、《山东电力市场参数（试行）》中涉及的价格参数均含税。 二、市场运营机构要结合《山东电力市场规则（试行）》，同步做好《山东电力市场参数（试行）》的执行与宣贯培训，规范开展市场运营，持续强化市场运营监控和风险防范，及时做好市场运行评估等相关工作。电网企业要继续加强市场宣贯培训，提高电力用户市场意识。各经营主体应做好市场规则及参数的学习，做好风险研判，依法依规参与电力市场。 三、零售合同解约金参数暂不执行，具体执行时间另行通知。 本通知自印发之日起执行。执行过程中遇到的问题，请及时报告我们。 国家能源局山东监管办公室 山东省发展和改革委员会 山东省能源局 2024年5月31日 附件： 山东电力市场参数（试行）.docx 扫一扫在手机打开当前页 网站地图 联系我们 地址: 济南市市中区七里山路55号 邮编:250002 主办单位: 国家能源局山东监管办公室 京公网安备 11010202007691 网站标识码: bm62000012号 京ICP备11044902号 国家能源局山东监管办公室版权所有，如需转载，请注明来源", "outgoing_relations": [{"target_id": "AUTO-20260426-CB9FE0315E", "target_title": "关于印发《山东电力市场规则(试行)》的通知_国家能源局山东监管办公室", "target_date": "2024-04-19", "relation_type": "引用依据", "basis": "文号：鲁监能市场规〔2024〕24号", "evidence": "国家能源局关于印发<电力现货市场基本规则（试行）>的通知》（发改能源规〔2023〕1217号）等文件要求，根据《关于印发<山东电力市场规则（试行）>的通知》（鲁监能市场规〔2024〕24号）规定，山东能源监管办会同省发展改革委、省能源局组织市场运营机构、电网企业和相关经营主体编制修订了《山东电力市场参数（试行）》，现予以印发。 一、《山东电力市场", "confidence": "高"}], "incoming_relations": []}, {"id": "AUTO-20260426-0E5C62271F", "title": "《山东电力市场规则(试行)》编制说明_国家能源局山东监管办公室", "department": "国家能源局派出机构", "collection_source": "国家能源局山东监管办公室", "publish_date": "2024-04-20", "document_number": "", "regions": ["山东"], "provinces": ["山东"], "source_type": "监管规则", "policy_level": "国家级", "topics": ["电力市场"], "keywords": ["电力市场"], "authority": "B", "time_sensitivity": "中期参考型", "status": "试行", "is_original": "是", "url": "https://sdb.nea.gov.cn/dtyw/tzgg/202404/t20240420_261036.html", "local_paths": "01_原始资料\\官方政策\\2024-04-20_山东_国家能源局派出机构_《山东电力市场规则(试行)》编制说明_国家能源局山东监管办公室.html; 03_处理后文本\\2024-04-20_山东_国家能源局派出机构_《山东电力市场规则(试行)》编制说明_国家能源局山东监管办公室.txt", "text_path": "03_处理后文本\\2024-04-20_山东_国家能源局派出机构_《山东电力市场规则(试行)》编制说明_国家能源局山东监管办公室.txt", "summary": "", "note": "《山东电力市场规则(试行)》编制说明 2024-04-20", "ingested_at": "2026-04-26", "review_status": "待人工复核", "snippet": "《山东电力市场规则(试行)》编制说明_国家能源局山东监管办公室 设为首页 工作邮箱 搜索 首页 机构概览 动态要闻 信息公开 在线办事 互动回应 专题专栏 《山东电力市场规则(试行)》编制说明 2024-04-20 12:21 来源：国家能源局山东监管办公室 Aa 字体： 小 | 中 | 大 《中共中央国务院关于进一步深化电力体制改革的若干意见》(中发〔2015〕9号)印发以来，山东电力市场建设以国家顶层设计思路为指导，在遵循电力系统运...", "text": "《山东电力市场规则(试行)》编制说明_国家能源局山东监管办公室 设为首页 工作邮箱 搜索 首页 机构概览 动态要闻 信息公开 在线办事 互动回应 专题专栏 《山东电力市场规则(试行)》编制说明 2024-04-20 12:21 来源：国家能源局山东监管办公室 Aa 字体： 小 | 中 | 大 《中共中央国务院关于进一步深化电力体制改革的若干意见》(中发〔2015〕9号)印发以来，山东电力市场建设以国家顶层设计思路为指导，在遵循电力系统运行规律和市场经济基本规律的基础上，一体化设计、系统性推进，构建了“中长期+现货+辅助服务+零售”协同有序的市场体系，各项市场功能定位明晰，交易品种衔接有序，电力市场建设与能源结构转型协调共进。创新建立合理补偿固定成本的发电侧“市场化容量补偿机制”、抑制发电企业行使市场力的“事前+事后市场力监管机制”、避免市场经营主体不合理套利的偏差收益回收及分摊机制等一系列特色市场机制，保障了市场健康运行和电力供应平稳有序。 作为国家首批电力现货市场建设试点地区，山东电力现货市场于2021年12月1日进入长周期结算试运行，经过两年多的不间断试运行，市场发现价格作用明显，高峰高电价激励供需紧张时期电源顶峰发电，低谷低电价引导电力富裕时段用户填谷用电，源荷两侧共同参与电网调节，主体多元、竞争有序的电力交易格局基本形成。随着山东电力市场化改革的不断深化、市场开放程度的持续提升、新型经营主体的迅速发展，部分现有市场机制已不能满足各类经营主体的交易和发展需求，亟需进一步完善山东电力市场规则、健全相关机制。 自2023年3月起，山东能源监管办会同省发展改革委、省能源局组织市场运营机构、电网公司、电力市场管理委员会、山东电力市场建设专班、有关经营主体等，基于近年来市场运行实践，结合《电力现货市场基本规则(试行)》《电力中长期交易基本规则》等国家基本规则要求，就市场关键机制优化完善、新型经营主体参与市场方式设计、市场运行费用等问题开展深入研究，广泛征集意见，并先后组织六轮集中工作，在充分吸收市场运营经验成果及各方意见基础上，对原《山东电力现货市场交易规则(试行)》《山东电力中长期市场交易规则(试行)》《山东电力零售市场交易规则(试行)》进行了修订，形成了《山东电力市场规则(试行)》。 《山东电力市场规则(试行)》共十九章，分别是：总则、市场成员、市场构成与价格、中长期市场运营、现货市场运营、日前市场交易组织、日内市场交易组织、实时市场交易组织、辅助服务市场运营、零售市场运营、计量、市场结算、市场力行为监管、信息披露、风险防控、市场干预、电力市场技术支持系统、争议处理、附则。重点修订内容概括如下。 (一)系统设计电力市场规则 构建了适应“中长期+现货+辅助服务+零售”市场体系的系统化市场规则，适用于在山东开展的电力中长期市场、现货市场、零售市场等电能量市场，以及与山东电力现货市场相衔接的电力辅助服务市场等。“一本规则”方便各市场运营机构、经营主体、电力用户等更加系统全面掌握市场运行机制。 (二)完善经营主体参与市场机制 根据国家相关政策及规则要求，进一步扩大了可参与山东电力市场的经营主体范围。统筹兼顾电网备用需求及抽水蓄能机组特性，制定抽水蓄能电站参与电能量市场交易结算机制;明确了核电参与市场的出清和结算模式;考虑电网安全运行及新型储能发展趋势，将独立新型储能参与市场方式优化为报量报价参与现货市场;根据虚拟电厂聚合资源类型、资源可调能力等因素，分类设置虚拟电厂参与市场交易结算机制，提高虚拟电厂参与市场的可操作性。 (三)优化电力市场结算机制 根据国家《电力现货市场基本规则(试行)》要求，在规则中明确中长期交易合约签订时，需要签订中长期结算参考点，中长期合同电量除按中长期合同成交价格结算外，还需结算所在节点与中长期结算参考点的现货价格差值，体现发电侧所在节点空间价值。将发电侧结算颗粒度由1小时调整为15分钟，能够更有效激励调节性电源参与系统调节。将现行规则中的市场偏差费用调整为市场运行费用，并按照产生机理分为3大类13项，增加阻塞费用以衔接带有结算参考点的经营主体电能量结算方式。 (四)新建一二次限价机制 落实国家现货市场基本规则要求，防范市场价格风险，建立一二次限价机制。正常交易情况下执行一次申报、出清限价，当市场价格高于价格限值的连续时间超过一定时长后，设置并执行二级出清价格限值。二级出清价格限值的上限参考长期平均电价水平确定，有助于维护发用电市场主体合法权益，促进电力市场规范平稳运行。 (五)优化市场化容量补偿机制分配方式 为有序衔接国家煤电容量电价机制，结合山东电力市场现行发电侧市场化容量补偿电价机制，综合考虑发电机组和新型经营主体运行特性及对保障电力供应的贡献能力，完善核电机组、风电场、新型经营主体等可用容量计算方法。其中，核电机组、风电场均按照负荷高峰时段平均市场化上网电力计算可用容量，并明确电力调度机构负责定期测试独立新型储能电站充放电能力，作为可用容量计算依据。 (六)完善市场力监管机制 为规范发电机组计划检修管理和停备消缺行为，防止电力平衡安全潜在风险，允许发电机组在电力平衡宽裕时期自主申报停机消缺的机制。为规避备用状态机组通过报高价避免开机及运行机组通过报高价停机消缺的情况，增加日前市场机组组合市场力事前监管机制。为与现货市场峰谷分时价格政策相匹配，在市场力监测环节，增加触发市场力后按照机组不同负荷率进行相应报价替换的方法，以适度保持报价替换的峰谷价差。 (七)调整调频辅助服务市场交易组织及费用结算方式。基于山东电网运行特性及新能源发展现状，设置调频容量分时段出清机制，满足不同时段电网调节需求，保障电网安全运行。根据《国家发展改革委国家能源局关于建立健全电力辅助服务市场价格机制的通知》(发改价格〔2024〕196号)要求，进一步扩大调频辅助服务市场参与主体范围，调整费用计算公式，采用基于调频里程的单一制价格机制进行费用计算。 (八)有序衔接机组并网运行考核与电力市场运营 综合考虑机组运行状态对市场价格的影响及市场化用户价格形成机制，将发电机组因非计划停运产生的“两个细则”考核费用，按照一定比例返还至市场化用户，实现发电机组并网运行管理与电力市场的有效衔接。 (九)丰富零售市场套餐种类 为适应不同类型经营主体多样化需求，进一步降低用户与售电公司之间的沟通成本，零售套餐在现有种类基础上增加灵活调节负荷零售套餐，虚拟电厂与具备调节能力的零售用户签订该类套餐后，可根据自身实际参与市场调节，约定收益分成比例，挖掘用户侧资源调节潜力。同时将探索建立与电煤、中长期价格或代理购电价格等联动的价格联动类零售套餐，增强市场价格传导的灵活性。 下一步，山东能源监管办将会同省发展改革委、省能源局等主管部门积极做好新版规则宣贯解读，加强市场运行监测分析，组织市场运营机构完善工作流程，确保新版规则有序落地实施。督促各经营主体加强市场风险研判，依法依规参与电力市场交易，维护良好市场秩序，保障山东电力市场平稳健康运行。 扫一扫在手机打开当前页 网站地图 联系我们 地址: 济南市市中区七里山路55号 邮编:250002 主办单位: 国家能源局山东监管办公室 京公网安备 11010202007691 网站标识码: bm62000012号 京ICP备11044902号 国家能源局山东监管办公室版权所有，如需转载，请注明来源", "outgoing_relations": [], "incoming_relations": []}, {"id": "AUTO-20260426-0A6267C300", "title": "关于征求《山东电力市场参数(试行)》(征求意见稿)意见的公告_国家能源局山东监管办公室", "department": "国家能源局派出机构", "collection_source": "国家能源局山东监管办公室", "publish_date": "2024-04-19", "document_number": "", "regions": ["山东"], "provinces": ["山东"], "source_type": "监管规则", "policy_level": "国家级", "topics": ["电力市场"], "keywords": ["电力市场"], "authority": "B", "time_sensitivity": "中期参考型", "status": "征求意见", "is_original": "是", "url": "https://sdb.nea.gov.cn/dtyw/tzgg/202404/t20240419_261032.html", "local_paths": "01_原始资料\\官方政策\\2024-04-19_山东_国家能源局派出机构_关于征求《山东电力市场参数(试行)》(征求意见稿)意见的公告_国家能源局山东监管办公室.html; 03_处理后文本\\2024-04-19_山东_国家能源局派出机构_关于征求《山东电力市场参数(试行)》(征求意见稿)意见的公告_国家能源局山东监管办公室.txt", "text_path": "03_处理后文本\\2024-04-19_山东_国家能源局派出机构_关于征求《山东电力市场参数(试行)》(征求意见稿)意见的公告_国家能源局山东监管办公室.txt", "summary": "", "note": "关于征求《山东电力 ，持续优化业务流程、完善系统功能。 四、电网企业要做好计量抄表等工作，根据《规则》按时提供计量数据，确保交易结算质量，及时足额进行电费结算。科学测算代理购电用户用电量及负荷曲线，按照国家和山东省有关规定规范开展代理购电业务。 五、各经营主体、电力用户应系统学习《规则》，做好风险研判，依法依规参与电力市场交易，主动维护良好交易秩序，促进市场健康平稳运行。 《规则》正式实施后，原山东电力市场交易规则和相关市场参数、文件通知等与本《规则》不一致的，按本《规则》执行。执行过程中遇有重大问题及时向山东能源监管办、省发展改革委、省能源局报告并提出工作建议。 联系电话：0531-67800757、67807898 电子邮箱：scjgc@cnea.gov.cn 附件： 《山东电力市场规则（试行）》.pdf 国家能源局山东监管办公室 山东省发展和改革委员会 山东省能源局 2024年4月18日 扫一扫在手机打开当前页 网站地图 联系我们 地址: 济南市市中区七里山路55号 邮编:250002 主办单位: 国家能源局山东监管办公室 京公网安备 11010202007691 网站标识码: bm62000012号 京ICP备11044902号 国家能源局山东监管办公室版权所有，如需转载，请注明来源", "outgoing_relations": [], "incoming_relations": [{"target_id": "AUTO-20260426-CAE77C6F94", "target_title": "关于印发《山东电力市场参数（试行）》的通知_国家能源局山东监管办公室", "target_date": "2024-05-31", "relation_type": "引用依据", "basis": "文号：鲁监能市场规〔2024〕24号", "evidence": "国家能源局关于印发<电力现货市场基本规则（试行）>的通知》（发改能源规〔2023〕1217号）等文件要求，根据《关于印发<山东电力市场规则（试行）>的通知》（鲁监能市场规〔2024〕24号）规定，山东能源监管办会同省发展改革委、省能源局组织市场运营机构、电网企业和相关经营主体编制修订了《山东电力市场参数（试行）》，现予以印发。 一、《山东电力市场", "confidence": "高"}, {"target_id": "AUTO-20260426-0A6267C300", "target_title": "关于征求《山东电力市场参数(试行)》(征求意见稿)意见的公告_国家能源局山东监管办公室", "target_date": "2024-04-19", "relation_type": "修订", "basis": "文号：鲁监能市场规〔2024〕24号", "evidence": "》(发改能源规〔2023〕1217号)等文件要求，山东能源监管办会同省发展改革委、省能源局组织市场运营机构和相关经营主体修订形成了《山东电力市场规则(试行)》(鲁监能市场规〔2024〕24号)。为适应电力市场运行需要，山东能源监管办会同省发展改革委、省能源局同步开展市场运行有关参数修订工作，经前期研究讨论，起草了《山东电力市场参数(试行)》(征求意", "confidence": "高"}]}, {"id": "AUTO-20260426-A4B66C7278", "title": "关于印发《山东电力爬坡辅助服务市场交易规则(试行)》的通知_国家能源局山东监管办公室", "department": "国家能源局派出机构", "collection_source": "国家能源局山东监管办公室", "publish_date": "2024-02-08", "document_number": "", "regions": ["山东"], "provinces": ["山东"], "source_type": "监管规则", "policy_level": "国家级", "topics": ["辅助服务"], "keywords": ["交易规则", "辅助服务"], "authority": "B", "time_sensitivity": "中期参考型", "status": "试行", "is_original": "是", "url": "https://sdb.nea.gov.cn/dtyw/tzgg/202402/t20240208_245961.html", "local_paths": "01_原始资料\\官方政策\\2024-02-08_山东_国家能源局派出机构_关于印发《山东电力爬坡辅助服务市场交易规则(试行)》的通知_国家能源局山东监管办公室.html; 03_处理后文本\\
